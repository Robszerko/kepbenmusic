<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KÉPBEN! MUSIC TELEVISION · Élő Adás</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700;800&display=swap" rel="stylesheet">
<!-- YouTube IFrame Player Broadcast API -->
<script src="https://www.youtube.com/iframe_api"></script>

<style>
    :root {
        --bg-color: #050811;
        --card-bg: #0f172a;
        --card-sub: #1e293b;
        --accent-cyan: #38bdf8;
        --accent-green: #22c55e;
        --accent-red: #ef4444;
        --accent-amber: #f59e0b;
        --accent-purple: #c084fc;
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --border: rgba(255, 255, 255, 0.12);

        /* Dinamikus Napszaki Színek */
        --theme-primary: #38bdf8;
        --theme-gradient: linear-gradient(135deg, rgba(11, 19, 41, 0.90) 0%, rgba(30, 58, 138, 0.90) 100%);
    }

    * {
        margin: 0; padding: 0; box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        user-select: none; -webkit-user-select: none; -webkit-user-drag: none;
    }

    body {
        background: radial-gradient(circle at 50% 10%, #111827 0%, var(--bg-color) 85%);
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color: var(--text-main);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 12px;
        overflow-x: hidden;
    }

    .player-wrapper {
        width: 100%;
        max-width: 1040px;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    /* 📺 16:9 PROFI TV KÉPERNYŐ KERET */
    .tv-screen-wrapper {
        position: relative;
        width: 100%;
        padding-top: 56.25%; /* 16:9 */
        background: #000000;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 12px 35px rgba(0,0,0,0.85);
        border: 1.5px solid var(--border);
        transform: translateZ(0);
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
        contain: layout paint size;
    }

    .tv-screen-wrapper:fullscreen, .tv-screen-wrapper:-webkit-full-screen {
        width: 100vw !important; height: 100vh !important;
        padding-top: 0 !important; border-radius: 0 !important; border: none !important;
    }

    /* 🎬 MP4 DUAL-DECK VIDEÓ RÉTEGEK */
    .tv-video-deck {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        object-fit: cover; z-index: 1; opacity: 0; pointer-events: none;
        transform: translateZ(0);
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
        will-change: opacity;
        transition: opacity 1.2s ease-in-out;
    }
    .tv-video-deck.active { opacity: 1; z-index: 2; }

    /* 🌐 DUAL YOUTUBE CHROMELESS DECK (AJÁNLÓMENTES MASZKOLÁS) */
    .tv-embed-deck {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        border: none;
        z-index: 1;
        opacity: 0;
        pointer-events: none !important;
        background: #000;
        transform: scale(1.05);
        transform-origin: center center;
        transition: opacity 1.2s ease-in-out;
        will-change: opacity;
    }
    .tv-embed-deck.active {
        opacity: 1;
        z-index: 3;
    }

    /* ✨ KÉPJAVÍTÓ MÓD */
    .tv-video-deck.enhanced-mode {
        filter: contrast(1.04) saturate(1.06);
    }

    /* 🎯 MÉRETARÁNYOS STÚDIÓ GRAFIKAI VÁSZON */
    .tv-graphics-canvas {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: 25;
        pointer-events: none;
        overflow: hidden;
        contain: layout paint;
    }

    /* 📺 MONOSZKÓP RÉTEG */
    .tv-monoscope-layer {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: 10; display: none; align-items: center; justify-content: center;
        background: #004b93; overflow: hidden;
    }
    .tv-monoscope-layer.active { display: flex; }
    .monoscope-svg { width: 100%; height: 100%; object-fit: contain; }

    /* ⏳ VÁRAKOZÓ / SZÜNET KÉPERNYŐ */
    .tv-standby-screen {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: 15; display: none; flex-direction: column; align-items: center; justify-content: center;
        background: #090d16;
        overflow: hidden; user-select: none;
    }
    .tv-standby-screen.active { display: flex; }

    .standby-content-box {
        position: relative; z-index: 5; display: flex; flex-direction: column; align-items: center; gap: 14px;
        text-align: center; padding: 24px 32px; background: rgba(15, 23, 42, 0.92);
        backdrop-filter: blur(14px);
        border: 1.5px solid rgba(56, 189, 248, 0.4); border-radius: 20px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.8); max-width: 620px; width: 85%;
    }
    .standby-brand { font-family: 'Space Mono', monospace; font-weight: 900; font-size: 1.6rem; color: #fff; letter-spacing: -0.5px; }
    .standby-msg { font-size: 1rem; font-weight: 700; color: var(--text-main); }
    .standby-time-badge {
        font-family: 'Space Mono', monospace; font-size: 1.1rem; font-weight: 800; color: var(--accent-cyan);
        background: rgba(56, 189, 248, 0.15); border: 1px solid rgba(56, 189, 248, 0.45); padding: 6px 18px; border-radius: 10px;
    }

    /* 🏷️ JOBB FELSŐ KÉPBEN! VÍZJEL + 🔴 ÉLŐ BADGE */
    .tv-watermark-wrap {
        position: absolute;
        top: 26px; right: 32px;
        z-index: 30;
        display: none;
        flex-direction: column;
        align-items: flex-end;
        gap: 6px;
        user-select: none;
        pointer-events: none;
        transform-origin: top right;
        transition: top 0.15s ease, right 0.15s ease, transform 0.15s ease, opacity 0.25s ease;
        opacity: 0.88;
    }

    .tv-watermark-clean {
        display: flex; align-items: center; gap: 6px;
    }
    .kb-icon-mini {
        width: 24px; height: 24px; stroke: #38bdf8; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round;
        display: inline-block; vertical-align: middle;
        filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
    }
    .tv-watermark-text-clean {
        font-family: 'Space Mono', monospace; font-weight: 800; font-size: 1.05rem; color: #ffffff;
        letter-spacing: -0.4px; display: flex; align-items: center;
        text-shadow: 0 2px 4px rgba(0,0,0,0.9);
    }

    /* 🔴 ÉLŐ ON-AIR BADGE */
    .tv-live-on-air-tag {
        display: none;
        align-items: center;
        gap: 4px;
        background: #ef4444;
        color: #ffffff;
        font-family: 'Space Mono', monospace;
        font-weight: 900;
        font-size: 0.65rem;
        padding: 2px 7px;
        border-radius: 4px;
        letter-spacing: 0.6px;
        margin-left: 6px;
        box-shadow: 0 0 10px rgba(239, 68, 68, 0.8);
        animation: livePulse 1.4s infinite alternate;
    }
    .tv-live-on-air-tag.active { display: inline-flex; }
    @keyframes livePulse {
        0% { opacity: 0.75; transform: scale(0.96); }
        100% { opacity: 1; transform: scale(1.02); filter: drop-shadow(0 0 6px #ef4444); }
    }

    .live-dot-static {
        width: 8px; height: 8px; border-radius: 50%; background: #ef4444; flex-shrink: 0; margin-left: 3px;
    }

    .tv-morning-clock {
        display: none; font-family: 'Space Mono', monospace; font-weight: 800; font-size: 0.8rem; color: #f59e0b;
        background: rgba(15, 23, 42, 0.7); padding: 2px 8px; border-radius: 6px; border: 1px solid rgba(245, 158, 11, 0.5);
        letter-spacing: 0.5px; margin-left: 6px; text-shadow: 0 1px 2px #000;
    }
    .tv-morning-clock.active { display: inline-block; }

    /* 🎴 LOWER-THIRD ZENEI GRAFIKAI SÁV */
    .tv-lower-third-banner {
        position: absolute;
        bottom: 74px;
        left: 20px;
        z-index: 33;
        display: flex;
        flex-direction: column;
        gap: 3px;
        max-width: 560px;
        width: calc(100% - 120px);
        pointer-events: none;
        user-select: none;
        transform: translate3d(-125%, 0, 0);
        opacity: 0;
        transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s linear;
        will-change: transform, opacity;
    }
    .tv-lower-third-banner.banner-show {
        transform: translate3d(0, 0, 0);
        opacity: 1;
    }

    .lt-header-bar {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: rgba(7, 13, 26, 0.88);
        backdrop-filter: blur(10px);
        padding: 4px 10px;
        border-radius: 6px;
        border-left: 4px solid var(--theme-primary);
        width: fit-content;
    }
    .lt-show-badge {
        display: flex;
        align-items: center;
        gap: 6px;
        font-family: 'Space Mono', monospace;
        font-size: 0.66rem;
        font-weight: 800;
        color: var(--theme-primary);
        letter-spacing: 0.3px;
        text-transform: uppercase;
    }
    .lt-show-badge .kb-icon-mini { width: 14px; height: 14px; stroke: var(--theme-primary); }

    .lt-live-eq {
        display: flex;
        align-items: flex-end;
        gap: 2px;
        height: 12px;
        margin-left: 2px;
    }
    .lt-eq-bar {
        width: 2.5px;
        height: 12px;
        background: var(--theme-primary);
        border-radius: 1px;
        animation: eqPulse 1.2s ease-in-out infinite alternate;
    }
    .lt-eq-bar:nth-child(1) { animation-delay: 0.1s; }
    .lt-eq-bar:nth-child(2) { animation-delay: 0.3s; }
    .lt-eq-bar:nth-child(3) { animation-delay: 0.2s; }
    .lt-eq-bar:nth-child(4) { animation-delay: 0.4s; }
    @keyframes eqPulse {
        0% { transform: scaleY(0.25); opacity: 0.6; }
        100% { transform: scaleY(1); opacity: 1; }
    }

    .lt-status-badge {
        font-family: 'Space Mono', monospace;
        font-size: 0.62rem;
        font-weight: 900;
        padding: 1px 7px;
        border-radius: 4px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-left: 4px;
    }
    .badge-most { background: #22c55e; color: #050811; }
    .badge-kovetkezik { background: #f59e0b; color: #050811; }
    .badge-kesobb { background: #c084fc; color: #050811; }

    .lt-content-box {
        background: var(--theme-gradient);
        backdrop-filter: blur(14px);
        border-left: 4px solid var(--theme-primary);
        border-radius: 8px;
        padding: 6px 12px;
        border-top: 1px solid rgba(255,255,255,0.22);
        display: flex;
        flex-direction: column;
        gap: 2px;
        max-width: 100%;
        box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .lt-artist-row {
        font-family: 'Space Mono', monospace;
        font-size: 0.78rem;
        font-weight: 800;
        color: var(--accent-cyan);
        letter-spacing: 0.2px;
        text-transform: uppercase;
        line-height: 1.2;
    }
    .lt-track-row {
        font-size: 0.92rem;
        font-weight: 800;
        color: #ffffff;
        letter-spacing: -0.1px;
        line-height: 1.25;
        text-shadow: 0 1px 3px rgba(0,0,0,0.9);
    }
    .lt-track-row.font-shrink { font-size: 0.78rem; }

    /* 🟡🔴 KORHATÁR KARIKA */
    .tv-age-rating-container {
        position: absolute;
        bottom: 74px; right: 28px;
        z-index: 35;
        display: none;
        align-items: center;
        justify-content: center;
        pointer-events: none;
        opacity: 0.9;
        transition: bottom 0.15s ease, right 0.15s ease, width 0.15s ease, height 0.15s ease;
    }
    .nmhh-ring {
        width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    }
    .nmhh-ring.ring-yellow { border: 4.5px solid #facc15; }
    .nmhh-ring.ring-red { border: 4.5px solid #ef4444; }
    .nmhh-number { font-family: 'Inter', sans-serif; font-weight: 900; font-size: 1.05rem; color: #ffffff; line-height: 1; }
    .nmhh-child-svg { width: 36px; height: 36px; fill: #22c55e; }

    /* 📰 2026 BROADCAST HÍRSÁV (FÉLÁTTETSZŐ MODERN ÜVEGHATÁS) */
    .tv-news-ticker-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 64px;
        background: linear-gradient(180deg, rgba(8, 15, 30, 0.65) 0%, rgba(4, 8, 18, 0.82) 100%);
        backdrop-filter: blur(14px) saturate(180%);
        -webkit-backdrop-filter: blur(14px) saturate(180%);
        border-top: 1.5px solid rgba(56, 189, 248, 0.65);
        z-index: 34;
        display: flex;
        align-items: stretch;
        user-select: none;
        pointer-events: none;
        box-shadow: 0 -4px 25px rgba(0, 0, 0, 0.5);
    }

    .ticker-weather-block {
        background: rgba(5, 10, 22, 0.55);
        border-right: 1.5px solid rgba(255, 255, 255, 0.15);
        padding: 0 12px;
        display: flex;
        align-items: center;
        gap: 10px;
        flex-shrink: 0;
        min-width: 205px;
    }
    .ticker-date-badge {
        display: flex;
        flex-direction: column;
        justify-content: center;
        border-right: 1px solid rgba(255,255,255,0.15);
        padding-right: 10px;
        line-height: 1.1;
    }
    .ticker-date-lbl { font-family: 'Space Mono', monospace; font-size: 0.68rem; font-weight: 800; color: #facc15; }
    .ticker-day-lbl { font-family: 'Space Mono', monospace; font-size: 0.54rem; font-weight: 700; color: #cbd5e1; text-transform: uppercase; }

    .weather-box-anim { display: flex; align-items: center; gap: 8px; transition: opacity 0.2s ease; }
    .weather-box-anim.switching { opacity: 0; }
    .weather-icon-badge { font-size: 1.3rem; line-height: 1; }
    .weather-info-col { display: flex; flex-direction: column; line-height: 1.1; }
    .weather-city-lbl { font-family: 'Space Mono', monospace; font-size: 0.64rem; font-weight: 800; color: #ffffff; text-shadow: 0 1px 2px #000; }
    .weather-temp-lbl { font-family: 'Space Mono', monospace; font-size: 0.80rem; font-weight: 900; color: var(--theme-primary); text-shadow: 0 1px 2px #000; }

    .news-display-viewport {
        flex: 1;
        position: relative;
        overflow: hidden;
        display: flex;
        align-items: center;
        padding: 4px 14px;
        min-width: 0;
    }

    .news-card-wrapper {
        width: 100%;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 3px;
        opacity: 0;
        transform: translateY(6px);
        transition: opacity 0.35s ease, transform 0.35s ease;
        min-width: 0;
    }
    .news-card-wrapper.news-visible { opacity: 1; transform: translateY(0); }
    .news-card-wrapper.news-exit { opacity: 0; transform: translateY(-6px); }

    .news-headline-row { display: flex; align-items: center; gap: 8px; width: 100%; min-width: 0; }
    .news-source-badge {
        font-family: 'Space Mono', monospace; font-size: 0.62rem; font-weight: 800; color: #facc15;
        background: rgba(250, 204, 21, 0.2); border: 1px solid rgba(250, 204, 21, 0.45);
        padding: 2px 7px; border-radius: 4px; flex-shrink: 0; display: inline-flex; align-items: center; gap: 5px;
    }
    .news-headline-text {
        font-size: 0.88rem; font-weight: 800; color: #ffffff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1;
        text-shadow: 0 1px 3px rgba(0,0,0,0.9);
    }
    .news-summary-text {
        font-size: 0.74rem; font-weight: 600; color: #f1f5f9; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        text-shadow: 0 1px 3px rgba(0,0,0,0.9);
    }

    /* 📅 MŰSORELŐZETES HUD */
    .tv-upcoming-drawer {
        position: absolute;
        top: 50px; left: 20px;
        width: 340px; max-width: 48vw;
        background: rgba(10, 16, 30, 0.95);
        border-left: 4px solid var(--theme-primary);
        border-radius: 12px;
        padding: 10px 14px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.6);
        z-index: 33;
        transform: translate3d(-125%, 0, 0);
        opacity: 0;
        transition: transform 0.35s ease, opacity 0.25s linear;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }
    .tv-upcoming-drawer.drawer-show { transform: translate3d(0, 0, 0); opacity: 1; }
    .drawer-header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.12); padding-bottom: 4px; }
    .drawer-title { font-family: 'Space Mono', monospace; font-size: 0.68rem; font-weight: 800; color: var(--theme-primary); display: flex; align-items: center; gap: 6px; }
    .drawer-list { display: flex; flex-direction: column; gap: 5px; max-height: 220px; overflow: hidden; }
    .drawer-item { display: flex; align-items: center; gap: 8px; background: #070c18; padding: 5px 8px; border-radius: 6px; }
    .drawer-time { font-family: 'Space Mono', monospace; font-size: 0.72rem; font-weight: 800; color: #facc15; background: rgba(250, 204, 21, 0.14); padding: 2px 5px; border-radius: 4px; }
    .drawer-track-meta { display: flex; flex-direction: column; overflow: hidden; }
    .drawer-track-artist { font-family: 'Space Mono', monospace; font-size: 0.64rem; font-weight: 800; color: var(--accent-cyan); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .drawer-track-title { font-size: 0.78rem; font-weight: 700; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* 🎮 NÉZŐI VEZÉRLŐSÁV */
    .viewer-bar {
        background: var(--card-bg); border: 1px solid var(--border); border-radius: 18px; padding: 10px 16px;
        display: flex; align-items: center; justify-content: space-between; gap: 12px;
        box-shadow: 0 6px 18px rgba(0,0,0,0.5);
    }
    .btn-play-tv {
        background: var(--accent-cyan); color: #030712; border: none; padding: 11px 22px; border-radius: 12px;
        font-family: 'Space Mono', monospace; font-size: 0.82rem; font-weight: 800; cursor: pointer; display: flex; align-items: center; gap: 8px;
        transition: transform 0.2s ease, background 0.2s ease; box-shadow: 0 0 12px rgba(56, 189, 248, 0.3);
    }
    .btn-play-tv:active { transform: scale(0.97); }

    .live-status-pill {
        display: flex; align-items: center; gap: 6px; font-family: 'Space Mono', monospace; font-size: 0.72rem; font-weight: 800;
        color: var(--text-muted); background: rgba(255, 255, 255, 0.05); padding: 6px 12px; border-radius: 20px; border: 1px solid var(--border);
    }
    .live-status-pill.online { color: var(--accent-green); border-color: rgba(34, 197, 94, 0.3); background: rgba(34, 197, 94, 0.1); }
    .live-status-pill.online .live-dot-static { background: var(--accent-green); box-shadow: 0 0 8px var(--accent-green); }

    .ctrl-group { display: flex; align-items: center; gap: 10px; }
    .icon-btn {
        background: rgba(255, 255, 255, 0.06); border: 1px solid var(--border); color: #fff; width: 36px; height: 36px; border-radius: 10px;
        display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s ease;
    }
    .icon-btn:hover { background: rgba(56, 189, 248, 0.15); border-color: var(--accent-cyan); }
    .icon-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; }
    .vol-slider-wrap { display: flex; align-items: center; gap: 6px; }
    .vol-slider { width: 75px; accent-color: var(--accent-cyan); cursor: pointer; }

    @media (max-width: 768px) {
        body { padding: 6px; }
        .tv-screen-wrapper { border-radius: 14px; }
        .viewer-bar { padding: 8px 12px; gap: 8px; flex-wrap: wrap; }
        .vol-slider { width: 55px; }
        .live-status-pill { display: none; }
        .btn-play-tv { padding: 8px 14px; font-size: 0.75rem; }
        .tv-lower-third-banner { width: calc(100% - 40px); max-width: 100%; bottom: 68px; left: 10px; }
        .tv-upcoming-drawer { width: 280px; max-width: 85vw; left: 12px; top: 40px; }
        .ticker-weather-block { min-width: 165px; padding: 0 8px; }
    }
</style>
</head>
<body oncontextmenu="return false;">

<div class="player-wrapper">

    <!-- 📺 DUAL-DECK TV KÉPERNYŐ + BEÁGYAZOTT STREAM DECK -->
    <div class="tv-screen-wrapper" id="tv-screen-container">
        <!-- 🎬 MP4 DUAL-DECK -->
        <video id="tv-video-deck-a" class="tv-video-deck active" playsinline preload="auto" webkit-playsinline></video>
        <video id="tv-video-deck-b" class="tv-video-deck" playsinline preload="none" webkit-playsinline></video>

        <!-- 🌐 DUAL YOUTUBE CHROMELESS DECK (AJÁNLÓMENTES MASZKOLÁS) -->
        <div id="tv-embed-deck-a" class="tv-embed-deck">
            <div id="yt-player-target-a" style="width:100%; height:100%;"></div>
        </div>
        <div id="tv-embed-deck-b" class="tv-embed-deck">
            <div id="yt-player-target-b" style="width:100%; height:100%;"></div>
        </div>

        <!-- 📺 TŰPONTOS PHILIPS PM5544 MONOSZKÓP -->

    function setupAudioNodes() {
        if (isAudioInitialized) return;
        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();

            compressorNode = audioCtx.createDynamicsCompressor();
            compressorNode.threshold.setValueAtTime(-24, audioCtx.currentTime);
            compressorNode.knee.setValueAtTime(30, audioCtx.currentTime);
            compressorNode.ratio.setValueAtTime(14, audioCtx.currentTime);
            compressorNode.attack.setValueAtTime(0.002, audioCtx.currentTime);
            compressorNode.release.setValueAtTime(0.20, audioCtx.currentTime);

            autoGainNode = audioCtx.createGain();
            autoGainNode.gain.setValueAtTime(1.0, audioCtx.currentTime);

            masterGainNode = audioCtx.createGain();
            masterGainNode.gain.setValueAtTime(masterVolume, audioCtx.currentTime);

            analyserNode = audioCtx.createAnalyser();
            analyserNode.fftSize = 256;

            compressorNode.connect(autoGainNode);
            autoGainNode.connect(analyserNode);
            analyserNode.connect(masterGainNode);
            masterGainNode.connect(audioCtx.destination);

            startAgcLevelMonitor();
            isAudioInitialized = true;
        } catch(e) {}
    }

    function startAgcLevelMonitor() {
        if (agcMonitorTimer) clearInterval(agcMonitorTimer);
        const dataArr = new Uint8Array(analyserNode.frequencyBinCount);

        agcMonitorTimer = setInterval(() => {
            if (!isViewerPlaying) return;
            analyserNode.getByteFrequencyData(dataArr);
            let sum = 0;
            for (let i = 0; i < dataArr.length; i++) sum += dataArr[i];
            let avg = sum / dataArr.length;

            if (avg > 0 && avg < 30) {
                autoGainNode.gain.linearRampToValueAtTime(1.4, audioCtx.currentTime + 0.4);
            } else if (avg > 90) {
                autoGainNode.gain.linearRampToValueAtTime(0.7, audioCtx.currentTime + 0.4);
            } else {
                autoGainNode.gain.linearRampToValueAtTime(1.0, audioCtx.currentTime + 0.4);
            }
        }, 500);
    }

    function setTvVolume(val) {
        masterVolume = parseFloat(val);
        if (isMuted && masterVolume > 0) isMuted = false;
        if (masterGainNode && audioCtx) masterGainNode.gain.setValueAtTime(isMuted ? 0 : masterVolume, audioCtx.currentTime);
        deckA.volume = isMuted ? 0 : masterVolume;
        deckB.volume = isMuted ? 0 : masterVolume;
        if (ytPlayerA && ytPlayerA.setVolume) ytPlayerA.setVolume(Math.round((isMuted ? 0 : masterVolume) * 100));
        if (ytPlayerB && ytPlayerB.setVolume) ytPlayerB.setVolume(Math.round((isMuted ? 0 : masterVolume) * 100));
    }

    function toggleMute() {
        isMuted = !isMuted;
        setTvVolume(isMuted ? 0 : masterVolume);
        document.getElementById('vol-slider').value = isMuted ? 0 : masterVolume;
    }

    function toggleViewerPlayback() {
        setupAudioNodes();
        isViewerPlaying = !isViewerPlaying;

        const btn = document.getElementById('btn-toggle-play');
        const icon = document.getElementById('play-icon');
        const text = document.getElementById('play-text');

    function updateClock() {
        const now = new Date();
        const y = now.getFullYear();
        const mo = String(now.getMonth() + 1).padStart(2, '0');
        const dt = String(now.getDate()).padStart(2, '0');
        const h = now.getHours();
        const m = now.getMinutes();
        const s = now.getSeconds();

        const dayNamesHu = ["VASÁRNAP", "HÉTFŐ", "KEDD", "SZERDA", "CSÜTÖRTÖK", "PÉNTEK", "SZOMBAT"];
        if (tickerLiveDate) tickerLiveDate.textContent = `${y}.${mo}.${dt}.`;
        if (tickerLiveDay) tickerLiveDay.textContent = dayNamesHu[now.getDay()];

        const monoClock = document.getElementById('mono-live-clock');
        if (monoClock) monoClock.textContent = now.toLocaleTimeString('hu-HU');

        if (h >= 6 && h < 10) {
            morningClockEl.textContent = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
            morningClockEl.classList.add('active');
        } else {
            morningClockEl.classList.remove('active');
        }

        const curCat = getDaypartKeyForHour(h);
        if (curCat !== currentActiveDaypartKey) {
            currentActiveDaypartKey = curCat;
            applyDaypartTheme(curCat);
        }

        evaluateAgeRatingVisibility();
        evaluateUpcomingDrawerSchedule(h, m, s);

        if (isViewerPlaying && isTvBroadcasting && !isVideoTransitioning && !transitionLock && !currentActiveTwitchStreamer) {
            const todayKey = getSelectedDateKey(0);
            const schedule = weekSchedules[todayKey] || [];
            const curSec = h * 3600 + m * 60 + s;

            const expectedIdx = schedule.findIndex(item => curSec >= item.startSec && curSec < item.endSec);
            if (expectedIdx !== -1 && expectedIdx !== currentClipIndex) {
                checkScheduleAndPlayback(curSec, schedule);
            } else if (expectedIdx !== -1) {
                const curClip = schedule[expectedIdx];
                const remainingSec = curClip.endSec - curSec;

                if (remainingSec <= 26 && remainingSec > (VIDEO_CROSSFADE_SEC + 1) && !isEndSequenceRunning) {
                    runTrackPresentationSequence(schedule, false);
                }

                if (remainingSec <= VIDEO_CROSSFADE_SEC && remainingSec >= 0) {
                    executeVideoCrossfade(false);
                }
            }
        }
    }
    setInterval(updateClock, 1000);

    function applyDaypartTheme(cat) {
        const conf = tvDaypartConfig[cat] || tvDaypartConfig.delelott;
        document.documentElement.style.setProperty('--theme-primary', conf.primaryColor);
        document.documentElement.style.setProperty('--theme-gradient', conf.gradient);
    }

    // 📺 MASTER ADÁS & STREAM LEJÁTSZÓ MOTOR (NÉZŐI OLDAL)
    function checkScheduleAndPlayback(currentSecToday, schedule) {
        if (!isViewerPlaying || transitionLock || currentActiveTwitchStreamer) return;

        if (!schedule || schedule.length === 0 || !isTvBroadcasting) {
            showMonoscope();
            return;
        }

        const foundIdx = schedule.findIndex(item => currentSecToday >= item.startSec && currentSecToday < item.endSec);

        if (foundIdx !== -1) {
            hideStandby();
            hideMonoscope();

            const clip = schedule[foundIdx];
            const offsetSec = Math.max(0, currentSecToday - clip.startSec);

            currentClipIndex = foundIdx;
            currentlyPlayingId = clip.id;
            isEndSequenceRunning = false;
            isIntroBannerRunning = true;

            if (clip.rating && clip.rating !== 'default') {
                applyAgeRating(clip.rating);
            }

            updateLiveBadgeUI(Boolean(clip.isStream));
            applyDaypartTheme(clip.cat);

            // 🌐 A) YOUTUBE KLIP LEJÁTSZÁSA
            if (clip.youtubeId || clip.isYouTubeClip) {
                deckA.pause(); deckB.pause();
                deckA.style.opacity = '0'; deckB.style.opacity = '0';

                const targetYtId = clip.youtubeId || extractYouTubeVideoId(clip.rawUrl || clip.url);
                const activePlayer = (activeYtDeck === 'A') ? ytPlayerA : ytPlayerB;
                const activeEmbedDeck = (activeYtDeck === 'A') ? embedDeckA : embedDeckB;
                const otherEmbedDeck = (activeYtDeck === 'A') ? embedDeckB : embedDeckA;

                otherEmbedDeck.classList.remove('active');
                otherEmbedDeck.style.opacity = '0';
                activeEmbedDeck.classList.add('active');
                activeEmbedDeck.style.opacity = '1';

                if (activePlayer && activePlayer.loadVideoById) {
                    activePlayer.loadVideoById({ videoId: targetYtId, startSeconds: Math.floor(offsetSec) });
                    activePlayer.unMute();
                    activePlayer.setVolume(Math.round((isMuted ? 0 : masterVolume) * 100));
                    startYtMonitor();
                }
            } else {
                // 🎬 B) MP4 VIDEÓKLIP LEJÁTSZÁSA
                clearInterval(ytMonitorInterval);
                embedDeckA.classList.remove('active'); embedDeckA.style.opacity = '0';
                embedDeckB.classList.remove('active'); embedDeckB.style.opacity = '0';
                if (ytPlayerA && ytPlayerA.stopVideo) ytPlayerA.stopVideo();
                if (ytPlayerB && ytPlayerB.stopVideo) ytPlayerB.stopVideo();

                const activeDeck = (activeDeckName === 'A') ? deckA : deckB;
                activeDeck.src = clip.url;
                activeDeck.currentTime = offsetSec;
                activeDeck.volume = isMuted ? 0 : masterVolume;
                activeDeck.style.opacity = '1';
                activeDeck.classList.add('active');
                activeDeck.play().catch(() => {});
            }

            if (offsetSec < 12) {
                setTimeout(() => { runTrackPresentationSequence(schedule, true); }, 500);
            } else {
                isIntroBannerRunning = false;
            }

            applyVisuals();
        } else {
            embedDeckA.classList.remove('active'); embedDeckA.style.opacity = '0';
            embedDeckB.classList.remove('active'); embedDeckB.style.opacity = '0';
            let nextClip = schedule.find(item => item.startSec > currentSecToday) || schedule[0];
            showStandby(nextClip ? nextClip.startTimeStr : null);
        }
    }

    function applyVisuals() {
        watermarkWrap.style.display = (isViewerPlaying && isLogoVisible && isTvBroadcasting) ? 'flex' : 'none';
        applyAgeRating(currentAgeRating);
        applyCloudPositions();
    }

    function applyAgeRating(rating) {
        currentAgeRating = rating;
        if (rating === 'none' || !rating || !isViewerPlaying || !isTvBroadcasting) {
            ageRatingContainer.style.display = 'none';
            return;
        }

        if (rating === '0') {
            nmhhRingBox.className = 'nmhh-ring';
            nmhhRingBox.style.border = 'none';
            nmhhRingBox.innerHTML = `<svg class="nmhh-child-svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" stroke="#22c55e" stroke-width="8" fill="transparent"/><circle cx="36" cy="40" r="6.5" fill="#22c55e"/><circle cx="64" cy="40" r="6.5" fill="#22c55e"/><path d="M 32 60 Q 50 82 68 60" stroke="#22c55e" stroke-width="8" fill="transparent" stroke-linecap="round"/></svg>`;
        } else if (rating === '18') {
            nmhhRingBox.className = 'nmhh-ring ring-red';
            nmhhRingBox.style.border = '4.5px solid #ef4444';
            nmhhRingBox.innerHTML = `<span class="nmhh-number">18</span>`;
        } else {
            nmhhRingBox.className = 'nmhh-ring ring-yellow';
            nmhhRingBox.style.border = '4.5px solid #facc15';
            nmhhRingBox.innerHTML = `<span class="nmhh-number">${rating}</span>`;
        }

        evaluateAgeRatingVisibility();

    function parseTimeToMinutes(timeStr) {
        if (!timeStr) return 0;
        const [h, m] = timeStr.split(':').map(Number);
        return (h || 0) * 60 + (m || 0);
    }

    function evaluateAgeRatingVisibility() {
        if (!isViewerPlaying || !isTvBroadcasting || currentAgeRating === 'none') {
            ageRatingContainer.style.display = 'none';
            return;
        }

        if (isRatingAutoTimerEnabled) {
            const now = new Date();
            const currentMinutes = now.getHours() * 60 + now.getMinutes();
            const onMinutes = parseTimeToMinutes(ratingTimerOnTime);
            const offMinutes = parseTimeToMinutes(ratingTimerOffTime);

            let isWithinActiveWindow = (onMinutes <= offMinutes) 
                ? (currentMinutes >= onMinutes && currentMinutes < offMinutes)
                : (currentMinutes >= onMinutes || currentMinutes < offMinutes);

            if (!isWithinActiveWindow) {
                ageRatingContainer.style.display = 'none';
                return;
            }
        }

        ageRatingContainer.style.display = 'flex';
    }

    function showStandby(resumeTimeStr) {
        if (!isViewerPlaying) return;
        deckA.pause(); deckB.pause();
        deckA.src = ""; deckB.src = "";
        deckA.style.opacity = '0'; deckB.style.opacity = '0';
        if (ytPlayerA && ytPlayerA.stopVideo) ytPlayerA.stopVideo();
        if (ytPlayerB && ytPlayerB.stopVideo) ytPlayerB.stopVideo();
        embedDeckA.classList.remove('active'); embedDeckA.style.opacity = '0';
        embedDeckB.classList.remove('active'); embedDeckB.style.opacity = '0';
        hideMonoscope();
        hideLowerThirdImmediate();
        upcomingDrawer.classList.remove('drawer-show');
        currentlyPlayingId = null;
        currentClipIndex = -1;
        updateLiveBadgeUI(false);

        standbyScreen.classList.add('active');
        standbyResumeTimeEl.textContent = resumeTimeStr ? `${resumeTimeStr}-kor` : "--:--:--";
    }

    function hideStandby() { standbyScreen.classList.remove('active'); }

    function showMonoscope() {
        if (!isMonoscopeActive && isViewerPlaying) {
            isMonoscopeActive = true;
            currentlyPlayingId = null;
            currentClipIndex = -1;
            deckA.pause(); deckB.pause();
            deckA.src = ""; deckB.src = "";
            deckA.style.opacity = '0'; deckB.style.opacity = '0';
            if (ytPlayerA && ytPlayerA.stopVideo) ytPlayerA.stopVideo();
            if (ytPlayerB && ytPlayerB.stopVideo) ytPlayerB.stopVideo();
            embedDeckA.classList.remove('active'); embedDeckA.style.opacity = '0';
            embedDeckB.classList.remove('active'); embedDeckB.style.opacity = '0';
            hideLowerThirdImmediate();
            upcomingDrawer.classList.remove('drawer-show');
            hideStandby();
            updateLiveBadgeUI(false);
            monoscopeLayer.classList.add('active');
        }
    }

    function hideMonoscope() {
        if (!isMonoscopeActive) return;
        isMonoscopeActive = false;
        monoscopeLayer.classList.remove('active');
    }

    function startYtMonitor() {
        clearInterval(ytMonitorInterval);
        ytMonitorInterval = setInterval(() => {
            if (!isViewerPlaying || !isTvBroadcasting || isVideoTransitioning || transitionLock || currentActiveTwitchStreamer) return;

            const activePlayer = (activeYtDeck === 'A') ? ytPlayerA : ytPlayerB;
            if (!activePlayer || !activePlayer.getCurrentTime) return;

            const curTime = activePlayer.getCurrentTime();
            const dur = activePlayer.getDuration();
            const remaining = dur - curTime;

            if (remaining <= 26 && remaining > (VIDEO_CROSSFADE_SEC + 1) && !isEndSequenceRunning) {
                const todayKey = getSelectedDateKey(0);
                runTrackPresentationSequence(weekSchedules[todayKey] || [], false);
            }

            if (dur > 0 && remaining <= VIDEO_CROSSFADE_SEC) {
                clearInterval(ytMonitorInterval);
                executeVideoCrossfade(false);
            }
        }, 250);
    }

    function executeVideoCrossfade(forceImmediate = false) {
        const todayKey = getSelectedDateKey(0);
        const schedule = weekSchedules[todayKey] || [];
        if (isVideoTransitioning || transitionLock || schedule.length === 0) return;

        isVideoTransitioning = true;
        transitionLock = true;
        clearInterval(ytMonitorInterval);
        hideLowerThirdImmediate();

        currentClipIndex = (currentClipIndex + 1) % schedule.length;
        const newClip = schedule[currentClipIndex];
        currentlyPlayingId = newClip.id;

        applyAgeRating(newClip.rating);
        updateLiveBadgeUI(Boolean(newClip.isStream));
        applyDaypartTheme(newClip.cat);

        const isNextYt = Boolean(newClip.youtubeId || newClip.isYouTubeClip);

        if (isNextYt) {
            const nextYtDeckName = (activeYtDeck === 'A') ? 'B' : 'A';
            const incomingEmbed = (nextYtDeckName === 'A') ? embedDeckA : embedDeckB;
            const outgoingEmbed = (nextYtDeckName === 'A') ? embedDeckB : embedDeckA;
            const incomingPlayer = (nextYtDeckName === 'A') ? ytPlayerA : ytPlayerB;
            const outgoingPlayer = (nextYtDeckName === 'A') ? ytPlayerB : ytPlayerA;
            const outgoingVideo = (activeDeckName === 'A') ? deckA : deckB;
            const targetYtId = newClip.youtubeId || extractYouTubeVideoId(newClip.rawUrl || newClip.url);

            incomingEmbed.classList.add('active');
            incomingEmbed.style.opacity = '0';

            if (incomingPlayer && incomingPlayer.loadVideoById) {
                incomingPlayer.loadVideoById({ videoId: targetYtId, startSeconds: 0 });
                incomingPlayer.unMute();
                incomingPlayer.setVolume(0);
            }

            let step = 0;
            const steps = 80;
            const timer = setInterval(() => {
                step++;
                const p = step / steps;
                const inVolCurve = Math.sin(p * Math.PI / 2);
                const outVolCurve = Math.cos(p * Math.PI / 2);

                incomingEmbed.style.opacity = inVolCurve.toFixed(3);
                if (incomingPlayer && incomingPlayer.setVolume) incomingPlayer.setVolume(Math.round((isMuted ? 0 : masterVolume) * 100 * inVolCurve));

                outgoingEmbed.style.opacity = outVolCurve.toFixed(3);
                if (outgoingPlayer && outgoingPlayer.setVolume) outgoingPlayer.setVolume(Math.round((isMuted ? 0 : masterVolume) * 100 * outVolCurve));

                outgoingVideo.style.opacity = outVolCurve.toFixed(3);
                outgoingVideo.volume = Math.max(0, (isMuted ? 0 : masterVolume) * outVolCurve);

                if (step >= steps) {
                    clearInterval(timer);
                    outgoingEmbed.classList.remove('active');
                    outgoingEmbed.style.opacity = '0';
                    if (outgoingPlayer && outgoingPlayer.stopVideo) outgoingPlayer.stopVideo();

                    outgoingVideo.pause();
                    outgoingVideo.classList.remove('active');
                    outgoingVideo.style.opacity = '0';

                    activeYtDeck = nextYtDeckName;
                    isVideoTransitioning = false;
                    transitionLock = false;
                    startYtMonitor();
                    runTrackPresentationSequence(schedule, true);
                }
            }, 100);
            return;
        }

        const currentDeck = (activeDeckName === 'A') ? deckA : deckB;
        const nextDeck = (activeDeckName === 'A') ? deckB : deckA;
        const nextDeckName = (activeDeckName === 'A') ? 'B' : 'A';
        const activeYtPlayer = (activeYtDeck === 'A') ? ytPlayerA : ytPlayerB;
        const activeYtEmbed = (activeYtDeck === 'A') ? embedDeckA : embedDeckB;

        nextDeck.src = newClip.url;
        nextDeck.currentTime = 0;
        nextDeck.volume = 0;
        nextDeck.style.opacity = '0';
        nextDeck.classList.add('active');
        nextDeck.play().catch(() => {});

        let step = 0;
        const steps = 80;
        const timer = setInterval(() => {
            step++;
            const p = step / steps;
            const inVolCurve = Math.sin(p * Math.PI / 2);
            const outVolCurve = Math.cos(p * Math.PI / 2);

            nextDeck.style.opacity = inVolCurve.toFixed(3);
            nextDeck.volume = Math.min(isMuted ? 0 : masterVolume, (isMuted ? 0 : masterVolume) * inVolCurve);

            currentDeck.style.opacity = outVolCurve.toFixed(3);
            currentDeck.volume = Math.max(0, (isMuted ? 0 : masterVolume) * outVolCurve);

            activeYtEmbed.style.opacity = outVolCurve.toFixed(3);
            if (activeYtPlayer && activeYtPlayer.setVolume) activeYtPlayer.setVolume(Math.round((isMuted ? 0 : masterVolume) * 100 * outVolCurve));

            if (step >= steps) {
                clearInterval(timer);
                currentDeck.pause();
                currentDeck.src = "";
                currentDeck.classList.remove('active');
                currentDeck.style.opacity = '0';

                activeYtEmbed.classList.remove('active');
                activeYtEmbed.style.opacity = '0';
                if (activeYtPlayer && activeYtPlayer.stopVideo) activeYtPlayer.stopVideo();

                activeDeckName = nextDeckName;
                isVideoTransitioning = false;
                transitionLock = false;
                runTrackPresentationSequence(schedule, true);
            }
        }, 100);
    }

    function triggerLowerThirdBanner(type, rawTrackTitle, showCat) {
        if (!isViewerPlaying || !isLogoVisible || !isTvBroadcasting) return;

        const showConfig = tvDaypartConfig[showCat] || tvDaypartConfig.delelott;
        applyDaypartTheme(showCat);

        const parsed = parseArtistAndTitle(rawTrackTitle);

        ltShowTitle.textContent = showConfig.title;
        ltStatusBadge.className = `lt-status-badge badge-${type.toLowerCase()}`;
        ltStatusBadge.textContent = type;
        ltArtistRow.textContent = parsed.artist;
        ltTrackRow.textContent = parsed.title;

        if (parsed.title.length > 36 || parsed.artist.length > 28) {
            ltTrackRow.classList.add('font-shrink');
        } else {
            ltTrackRow.classList.remove('font-shrink');
        }

        lowerThirdBanner.classList.add('banner-show');
    }

    function hideLowerThirdImmediate() {
        clearTimeout(bannerHideTimeout);
        bannerSequenceTimers.forEach(t => clearTimeout(t));
        bannerSequenceTimers = [];
        isIntroBannerRunning = false;
        isEndSequenceRunning = false;
        lowerThirdBanner.classList.remove('banner-show');
    }

    function runTrackPresentationSequence(schedule, isIntro = true) {
        if (!isViewerPlaying || !isLogoVisible || !isTvBroadcasting) return;

        hideLowerThirdImmediate();

        const curClip = schedule[currentClipIndex];
        const curCat = curClip?.cat || getDaypartKeyForHour(new Date().getHours());
        const nextClip = schedule[(currentClipIndex + 1) % schedule.length];
        const laterClip = schedule[(currentClipIndex + 2) % schedule.length];

        if (isIntro) {
            isIntroBannerRunning = true;
            if (curClip) triggerLowerThirdBanner("MOST", curClip.title, curCat);

            bannerSequenceTimers.push(setTimeout(() => {
                lowerThirdBanner.classList.remove('banner-show');
                isIntroBannerRunning = false;
            }, 7500));
        } else {
            isEndSequenceRunning = true;
            if (curClip) triggerLowerThirdBanner("MOST", curClip.title, curCat);

            bannerSequenceTimers.push(setTimeout(() => {
                if (nextClip && isViewerPlaying) triggerLowerThirdBanner("KÖVETKEZIK", nextClip.title, curCat);
            }, 6000));

            bannerSequenceTimers.push(setTimeout(() => {
                if (laterClip && isViewerPlaying) triggerLowerThirdBanner("KÉSŐBB", laterClip.title, curCat);
            }, 12000));

            bannerSequenceTimers.push(setTimeout(() => {
                lowerThirdBanner.classList.remove('banner-show');
                isEndSequenceRunning = false;
            }, 18000));
        }
    }

    async function fetchLiveNews() {
        try {
            const res = await fetch(`${WORKER_URL}?_t=${Date.now()}`);
            if (res.ok) {
                const data = await res.json();
                let rawList = [];
                if (data && data.news) {
                    rawList = Array.isArray(data.news) ? data.news : Object.values(data.news);
                }

                if (rawList.length > 0) {
                    const processed = rawList.map(item => {
                        let timeMs = Date.now();
                        if (item.date) {
                            const p = new Date(item.date).getTime();
                            if (!isNaN(p)) timeMs = p;
                        }
                        return {
                            title: cleanHtmlText(item.title || ""),
                            summary: cleanHtmlText(item.description || item.summary || ""),
                            source: (item.source || "KÉPBEN!").toUpperCase(),
                            timeMs: timeMs,
                            timeStr: formatNewsTime(item.date)
                        };
                    });

                    processed.sort((a, b) => b.timeMs - a.timeMs);
                    activeNewsQueue = processed;
                    currentNewsItemIndex = 0;
                    displayNextNewsCard();
                }
            }
        } catch(e) {}
    }

    function formatNewsTime(dateVal) {
        if (!dateVal) return "MA";
        const d = new Date(dateVal);
        if (isNaN(d.getTime())) return "MA";
        const now = new Date();
        const isToday = d.toDateString() === now.toDateString();
        const hh = String(d.getHours()).padStart(2, '0');
        const mm = String(d.getMinutes()).padStart(2, '0');
        return isToday ? `MA ${hh}:${mm}` : `${d.getMonth()+1}.${d.getDate()}. ${hh}:${mm}`;
    }

    function displayNextNewsCard() {
        if (activeNewsQueue.length === 0) return;
        clearTimeout(newsRotationTimer);

        if (currentNewsItemIndex >= activeNewsQueue.length) currentNewsItemIndex = 0;
        const item = activeNewsQueue[currentNewsItemIndex];

        newsCardBox.classList.remove('news-visible');
        newsCardBox.classList.add('news-exit');

        setTimeout(() => {
            newsHeadlineText.textContent = item.title;
            newsSummaryText.textContent = item.summary || "A hír részleteit és a teljes műsort keresse a KÉPBEN! Music Television online felületein.";
            newsSourceBadge.innerHTML = `<span>📌 ${item.source}</span><span style="opacity:0.5;">|</span><span>${item.timeStr}</span>`;

            newsCardBox.classList.remove('news-exit');
            newsCardBox.classList.add('news-visible');

            currentNewsItemIndex = (currentNewsItemIndex + 1) % activeNewsQueue.length;
            newsRotationTimer = setTimeout(displayNextNewsCard, 11000);
        }, 320);
    }

    async function fetchLiveWeather() {
        try {
            const resWorker = await fetch(`${WORKER_URL}?_t=${Date.now()}`);
            if (resWorker.ok) {
                const dataWorker = await resWorker.json();
                if (dataWorker && Array.isArray(dataWorker.weather) && dataWorker.weather.length > 0) {
                    cachedWeatherData = dataWorker.weather;
                    renderCurrentWeatherCity();
                    return;
                }
            }
        } catch(e) {}
    }

    function renderCurrentWeatherCity() {
        if (cachedWeatherData.length === 0) return;
        const c = cachedWeatherData[currentWeatherCityIndex % cachedWeatherData.length];
        weatherCityLbl.textContent = c.name;
        const tempVal = parseFloat(c.temp);
        weatherTempLbl.textContent = `${tempVal > 0 ? '+' : ''}${c.temp}°C`;
        weatherIconBadge.textContent = c.icon;
    }

    function startWeatherCityRotator() {
        if (weatherCityInterval) clearInterval(weatherCityInterval);
        weatherCityInterval = setInterval(() => {
            if (cachedWeatherData.length === 0) return;
            currentWeatherCityIndex = (currentWeatherCityIndex + 1) % cachedWeatherData.length;
            weatherBoxAnim.classList.add('switching');
            setTimeout(() => {
                renderCurrentWeatherCity();
                weatherBoxAnim.classList.remove('switching');
            }, 180);
        }, 8000);
    }

    function evaluateUpcomingDrawerSchedule(hour, minute, second) {
        if (!isViewerPlaying || isVideoTransitioning || isIntroBannerRunning || isEndSequenceRunning) return;

        if ([0, 15, 30, 45].includes(minute) && second === 12 && lastDrawerTriggerMinute !== minute) {
            lastDrawerTriggerMinute = minute;
            triggerUpcomingDrawer(hour);
        }
    }

    function triggerUpcomingDrawer(hour) {
        const todayKey = getSelectedDateKey(0);
        const schedule = weekSchedules[todayKey] || [];
        if (schedule.length === 0) return;

        const now = new Date();
        const curSecToday = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
        const windowEndSec = curSecToday + (30 * 60);

        const upcomingClips = schedule.filter(item => item.startSec > curSecToday && item.startSec <= windowEndSec);
        if (upcomingClips.length === 0) return;

        const curCat = getDaypartKeyForHour(hour !== undefined ? hour : now.getHours());
        const showConfig = tvDaypartConfig[curCat] || tvDaypartConfig.delelott;
        drawerShowBlockTitle.textContent = `${showConfig.title} · MŰSORAJÁNLÓ`;

        drawerUpcomingList.innerHTML = upcomingClips.slice(0, 4).map(clip => {
            const parsed = parseArtistAndTitle(clip.title);
            const timeFormatted = clip.startTimeStr.slice(0, 5);
            return `
                <div class="drawer-item">
                    <span class="drawer-time">${timeFormatted}</span>
                    <div class="drawer-track-meta">
                        <span class="drawer-track-artist">${parsed.artist}</span>
                        <span class="drawer-track-title">${parsed.title}</span>
                    </div>
                </div>
            `;
        }).join('');

        upcomingDrawer.classList.add('drawer-show');
        applyCloudPositions();

        clearTimeout(upcomingDrawerHideTimer);
        upcomingDrawerHideTimer = setTimeout(() => {
            upcomingDrawer.classList.remove('drawer-show');
        }, 20000);
    }

    // ⚡ REALTIME FIREBASE SZINKRONIZÁCIÓ (STUDIO ÁLLAPOT KÖVETÉSE)
    function applyBroadcastSettingsState(s) {
        if (!s || typeof s !== 'object') return;
        if (s.isBroadcasting !== undefined) isTvBroadcasting = s.isBroadcasting;
        if (s.logo_visible !== undefined) isLogoVisible = s.logo_visible;
        if (s.rating !== undefined) currentAgeRating = s.rating;
        if (s.live_badge_mode !== undefined) liveBadgeMode = s.live_badge_mode;
        if (s.rating_auto_timer !== undefined) isRatingAutoTimerEnabled = s.rating_auto_timer;
        if (s.rating_on_time !== undefined) ratingTimerOnTime = s.rating_on_time;
        if (s.rating_off_time !== undefined) ratingTimerOffTime = s.rating_off_time;

        if (s.video_enhanced !== undefined) {
            isVideoEnhanced = s.video_enhanced;
            deckA.classList.toggle('enhanced-mode', isVideoEnhanced);
            deckB.classList.toggle('enhanced-mode', isVideoEnhanced);
        }

        cloudPositions = s;

        const badge = document.getElementById('live-status-badge');
        const text = document.getElementById('live-status-text');
        if (isTvBroadcasting) {
            badge.classList.add('online');
            text.textContent = 'ÉLŐ ADÁS';
        } else {
            badge.classList.remove('online');
            text.textContent = 'OFFLINE';
        }

        if (isViewerPlaying) {
            applyVisuals();
            if (!isTvBroadcasting) {
                showMonoscope();
            } else if (isMonoscopeActive) {
                const now = new Date();
                const currentSecToday = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
                checkScheduleAndPlayback(currentSecToday, weekSchedules[getSelectedDateKey(0)] || []);
            }
        }
    }

    function applyScheduleState(data) {
        if (!data || typeof data !== 'object') return;
        weekSchedules = data;
        if (isViewerPlaying && isTvBroadcasting) {
            const now = new Date();
            const currentSecToday = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
            const todaySched = weekSchedules[getSelectedDateKey(0)] || [];
            const currentScheduledItem = todaySched.find(item => currentSecToday >= item.startSec && currentSecToday < item.endSec);

            if (!currentScheduledItem || currentScheduledItem.id !== currentlyPlayingId) {
                checkScheduleAndPlayback(currentSecToday, todaySched);
            } else if (currentScheduledItem && currentScheduledItem.id === currentlyPlayingId) {
                const parsed = parseArtistAndTitle(currentScheduledItem.title);
                ltArtistRow.textContent = parsed.artist;
                ltTrackRow.textContent = parsed.title;
            }
        }
    }

    async function initRealtimeBroadcastSync() {
        try {
            const [setRes, schRes] = await Promise.all([
                fetch(`${FIREBASE_URL}/tv_broadcast_settings.json?_t=${Date.now()}`),
                fetch(`${FIREBASE_URL}/tv_week_schedules.json?_t=${Date.now()}`)
            ]);
            if (setRes.ok) applyBroadcastSettingsState(await setRes.json());
            if (schRes.ok) applyScheduleState(await schRes.json());
        } catch(e) {}

        try {
            const settingsSource = new EventSource(`${FIREBASE_URL}/tv_broadcast_settings.json`);
            settingsSource.addEventListener('put', e => {
                try {
                    const payload = JSON.parse(e.data);
                    const s = (payload.path === "/") ? payload.data : payload;
                    applyBroadcastSettingsState(s);
                } catch(err) {}
            });

            const schedulesSource = new EventSource(`${FIREBASE_URL}/tv_week_schedules.json`);
            schedulesSource.addEventListener('put', e => {
                try {
                    const payload = JSON.parse(e.data);
                    const data = (payload.path === "/") ? payload.data : payload;
                    applyScheduleState(data);
                } catch(err) {}
            });
        } catch(err) {}

        setInterval(async () => {
            try {
                const res = await fetch(`${FIREBASE_URL}/tv_broadcast_settings.json?_t=${Date.now()}`);
                if (res.ok) applyBroadcastSettingsState(await res.json());
            } catch(e) {}
        }, 1500);
    }

    function toggleFullscreen() {
        if (!document.fullscreenElement && !document.webkitFullscreenElement) {
            if (tvScreenContainer.requestFullscreen) tvScreenContainer.requestFullscreen();
            else if (tvScreenContainer.webkitRequestFullscreen) tvScreenContainer.webkitRequestFullscreen();
        } else {
            if (document.exitFullscreen) document.exitFullscreen();
            else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        }
    }

    function togglePiP() {
        const active = (activeDeckName === 'A') ? deckA : deckB;
        if (document.pictureInPictureElement) document.exitPictureInPicture();
        else if (active.requestPictureInPicture) active.requestPictureInPicture();
    }

    window.addEventListener('DOMContentLoaded', async () => {
        updateResponsiveScaling();
        await initRealtimeBroadcastSync();
        fetchLiveNews();
        fetchLiveWeather();
        startWeatherCityRotator();
        setInterval(fetchLiveNews, 10 * 60 * 1000);
        setInterval(fetchLiveWeather, 10 * 60 * 1000);
    });
</script>
</body>
