<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KÉPBEN! MUSIC TELEVISION · Élő Adás</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=Space+Mono:wght@700;800&display=swap" rel="stylesheet">

<style>
    :root {
        --bg-color: #050811;
        --card-bg: rgba(15, 23, 42, 0.90);
        --accent-cyan: #38bdf8;
        --accent-green: #22c55e;
        --accent-red: #ef4444;
        --accent-amber: #f59e0b;
        --accent-purple: #c084fc;
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --border: rgba(255, 255, 255, 0.12);

        /* Dinamikus Napszaki Színek */
        --theme-primary: #38bdf8;
        --theme-gradient: linear-gradient(135deg, rgba(15, 23, 42, 0.95) 0%, rgba(30, 58, 138, 0.92) 100%);
    }

    * {
        margin: 0; padding: 0; box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        user-select: none; -webkit-user-select: none; -webkit-user-drag: none;
    }

    body {
        background: radial-gradient(circle at 50% 10%, #111827 0%, var(--bg-color) 85%);
        font-family: 'Inter', sans-serif;
        color: var(--text-main);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 12px;
        overflow-x: hidden;
    }

    .player-wrapper {
        width: 100%;
        max-width: 1020px;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    /* 📺 16:9 PROFI TV KÉPERNYŐ KERET */
    .tv-screen-wrapper {
        position: relative;
        width: 100%;
        padding-top: 56.25%; /* 16:9 */
        background: #000000;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 25px 65px rgba(0,0,0,0.9), 0 0 35px rgba(56, 189, 248, 0.15);
        border: 1.5px solid var(--border);
    }

    .tv-screen-wrapper:fullscreen, .tv-screen-wrapper:-webkit-full-screen {
        width: 100vw !important; height: 100vh !important;
        padding-top: 0 !important; border-radius: 0 !important; border: none !important;
    }

    .tv-video-deck {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        object-fit: cover; z-index: 1; opacity: 0; pointer-events: none;
        transition: opacity 0.35s ease;
    }
    .tv-video-deck.active { opacity: 1; z-index: 2; }

    /* 📺 MONOSZKÓP RÉTEG */
    .tv-monoscope-layer {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: 10; display: none; align-items: center; justify-content: center;
        background: #004b93; overflow: hidden;
    }
    .tv-monoscope-layer.active { display: flex; }
    .monoscope-svg { width: 100%; height: 100%; object-fit: contain; }

    /* ⏳ VÁRAKOZÓ / SZÜNET KÉPERNYŐ */
    .tv-standby-screen {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: 15; display: none; flex-direction: column; align-items: center; justify-content: center;
        background: radial-gradient(circle at 50% 50%, #0f172a 0%, #050811 90%);
        overflow: hidden; user-select: none;
    }
    .tv-standby-screen.active { display: flex; }

    .standby-content-box {
        position: relative; z-index: 5; display: flex; flex-direction: column; align-items: center; gap: 14px;
        text-align: center; padding: 24px 32px; background: rgba(15, 23, 42, 0.85);
        border: 1.5px solid rgba(56, 189, 248, 0.35); border-radius: 20px;
        backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
        box-shadow: 0 20px 50px rgba(0,0,0,0.85); max-width: 620px; width: 85%;
    }
    .standby-brand { font-family: 'Space Mono', monospace; font-weight: 900; font-size: 1.6rem; color: #fff; letter-spacing: -0.5px; }
    .standby-msg { font-size: 1rem; font-weight: 700; color: var(--text-main); }
    .standby-time-badge {
        font-family: 'Space Mono', monospace; font-size: 1.1rem; font-weight: 800; color: var(--accent-cyan);
        background: rgba(56, 189, 248, 0.15); border: 1px solid rgba(56, 189, 248, 0.45); padding: 6px 18px; border-radius: 10px;
    }

    /* 🏷️ JOBB FELSŐ KÉPBEN! VÍZJEL & 3D FLIP KÁRTYA CONTAINER */
    .tv-watermark-wrap {
        position: absolute;
        top: 28px; right: 38px;
        z-index: 30; display: none; flex-direction: column; align-items: flex-end; gap: 8px;
        user-select: none; pointer-events: none; transform-origin: top right;
        transition: top 0.15s ease, right 0.15s ease, transform 0.15s ease, opacity 0.25s ease;
    }

    .tv-watermark-clean {
        display: flex; align-items: center; gap: 6px;
        filter: drop-shadow(0 2px 8px rgba(0,0,0,0.95));
    }
    .kb-icon-mini {
        width: 24px; height: 24px; stroke: #38bdf8; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round;
    }
    .tv-watermark-text-clean {
        font-family: 'Space Mono', monospace; font-weight: 800; font-size: 1.05rem; color: #ffffff;
        letter-spacing: -0.4px; text-shadow: 0 2px 6px rgba(0,0,0,0.95); display: flex; align-items: center;
    }
    .live-dot-static {
        width: 8px; height: 8px; border-radius: 50%; background: #ef4444; box-shadow: 0 0 8px #ef4444; flex-shrink: 0; margin-left: 3px;
    }

    .tv-morning-clock {
        display: none; font-family: 'Space Mono', monospace; font-weight: 800; font-size: 0.8rem; color: #f59e0b;
        background: rgba(15, 23, 42, 0.85); padding: 2px 8px; border-radius: 6px; border: 1px solid rgba(245, 158, 11, 0.5);
        letter-spacing: 0.5px; box-shadow: 0 2px 8px rgba(0,0,0,0.6); margin-left: 6px;
    }
    .tv-morning-clock.active { display: inline-block; }

    /* 🎴 3D FLIP KÁRTYA */
    .tv-flip-container { perspective: 800px; width: 310px; display: flex; justify-content: flex-end; }
    .tv-flip-card {
        width: 100%; background: var(--theme-gradient); border-right: 4.5px solid var(--theme-primary); border-radius: 12px;
        padding: 8px 12px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
        border-top: 1px solid rgba(255,255,255,0.18); border-bottom: 1px solid rgba(255,255,255,0.18); border-left: 1px solid rgba(255,255,255,0.18);
        box-shadow: 0 12px 30px rgba(0,0,0,0.7), 0 0 15px rgba(56, 189, 248, 0.15); display: flex; flex-direction: column; gap: 3px;
        transform-origin: top center; transform: rotateX(-90deg) scale(0.95); opacity: 0;
        transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.25s ease;
    }
    .tv-flip-card.flip-show { transform: rotateX(0deg) scale(1); opacity: 1; }
    .tv-flip-card.flip-hide { transform: rotateX(90deg) scale(0.95); opacity: 0; transition: transform 0.3s ease-in, opacity 0.2s ease-in; }

    .flip-header-row { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
    .flip-status-badge {
        font-family: 'Space Mono', monospace; font-size: 0.65rem; font-weight: 800; padding: 2px 7px; border-radius: 4px; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .badge-most { background: #22c55e; color: #050811; }
    .badge-kovetkezik { background: #f59e0b; color: #050811; }
    .badge-kesobb { background: #c084fc; color: #050811; }

    .flip-show-name { font-family: 'Space Mono', monospace; font-size: 0.66rem; font-weight: 700; color: var(--theme-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .flip-track-title { font-size: 0.88rem; font-weight: 800; color: #ffffff; letter-spacing: -0.2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 2px 6px rgba(0,0,0,0.8); }

    /* 🟡🔴 KORHATÁR KARIKA */
    .tv-age-rating-container {
        position: absolute; bottom: 60px; right: 32px; z-index: 35; display: none; align-items: center; justify-content: center;
        pointer-events: none; background: transparent !important; box-shadow: none !important; opacity: 0.85; transform-origin: bottom right;
        transition: bottom 0.15s ease, right 0.15s ease, opacity 0.25s ease, transform 0.15s ease;
    }
    .nmhh-ring { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: transparent !important; box-sizing: border-box; }
    .nmhh-ring.ring-yellow { border: 5.5px solid #facc15 !important; }
    .nmhh-ring.ring-red { border: 5.5px solid #ef4444 !important; }
    .nmhh-number { font-family: 'Inter', sans-serif; font-weight: 900; font-size: 1.1rem; color: #ffffff !important; line-height: 1; letter-spacing: -0.5px; }
    .nmhh-child-svg { width: 38px; height: 38px; fill: #22c55e; }

    /* ☕🌅 REGGELI HÍR- ÉS IDŐJÁRÁS KÁRTYA */
    .tv-morning-info-panel {
        position: absolute; bottom: 40px; left: 32px; width: 420px; max-width: calc(100% - 130px);
        background: linear-gradient(135deg, rgba(22, 16, 38, 0.62) 0%, rgba(48, 24, 18, 0.58) 50%, rgba(15, 23, 42, 0.68) 100%);
        border-left: 4.5px solid #f59e0b; border-top: 1px solid rgba(251, 191, 36, 0.4); border-right: 1px solid rgba(255, 255, 255, 0.15); border-bottom: 1px solid rgba(245, 158, 11, 0.25);
        border-radius: 16px; padding: 9px 13px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
        box-shadow: 0 14px 34px rgba(0, 0, 0, 0.75), 0 0 25px rgba(245, 158, 11, 0.2); z-index: 34; display: none; flex-direction: column; gap: 5px;
        user-select: none; pointer-events: none; transform-origin: bottom left; transform: translateY(25px) scale(0.96); opacity: 0;
        transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
    }
    .tv-morning-info-panel.info-show { display: flex; transform: translateY(0) scale(1); opacity: 1; }
    .info-header-row { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255, 255, 255, 0.14); padding-bottom: 4px; gap: 6px; }
    .info-badge-title { font-family: 'Space Mono', monospace; font-size: 0.66rem; font-weight: 800; color: #f59e0b; display: flex; align-items: center; gap: 6px; }
    .coffee-cup-svg { width: 16px; height: 16px; stroke: #f59e0b; fill: none; stroke-width: 2; }
    .info-live-rates { font-family: 'Space Mono', monospace; font-size: 0.62rem; font-weight: 800; color: #38bdf8; display: flex; gap: 6px; }
    .info-news-box { display: flex; flex-direction: column; gap: 2px; }
    .info-source-tag { font-family: 'Space Mono', monospace; font-size: 0.58rem; font-weight: 900; padding: 1px 5px; border-radius: 4px; background: linear-gradient(135deg, #f59e0b 0%, #ea580c 100%); color: #050811; text-transform: uppercase; }
    .info-news-headline { font-size: 0.86rem; font-weight: 800; color: #ffffff; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .info-weather-box { display: none; flex-direction: column; gap: 3px; }
    .info-weather-box.active { display: flex; }
    .weather-city-name { font-family: 'Space Mono', monospace; font-size: 0.86rem; font-weight: 800; color: #ffffff; }
    .weather-temp-badge { font-family: 'Space Mono', monospace; font-size: 1.05rem; font-weight: 900; color: #f59e0b; }
    .weather-cond-desc { font-size: 0.72rem; font-weight: 700; color: #bae6fd; }

    /* 🎮 NÉZŐI VEZÉRLŐSÁV */
    .viewer-bar {
        background: var(--card-bg); border: 1px solid var(--border); border-radius: 18px; padding: 10px 16px;
        display: flex; align-items: center; justify-content: space-between; gap: 12px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .btn-play-tv {
        background: var(--accent-cyan); color: #030712; border: none; padding: 11px 22px; border-radius: 12px;
        font-family: 'Space Mono', monospace; font-size: 0.82rem; font-weight: 800; cursor: pointer; display: flex; align-items: center; gap: 8px;
        transition: transform 0.2s ease, background 0.2s ease; box-shadow: 0 0 15px rgba(56, 189, 248, 0.35);
    }
    .btn-play-tv:active { transform: scale(0.97); }

    .live-status-pill {
        display: flex; align-items: center; gap: 6px; font-family: 'Space Mono', monospace; font-size: 0.72rem; font-weight: 800;
        color: var(--text-muted); background: rgba(255, 255, 255, 0.05); padding: 6px 12px; border-radius: 20px; border: 1px solid var(--border);
    }
    .live-status-pill.online { color: var(--accent-green); border-color: rgba(34, 197, 94, 0.3); background: rgba(34, 197, 94, 0.1); }
    .live-status-pill.online .live-dot-static { background: var(--accent-green); box-shadow: 0 0 8px var(--accent-green); }

    .ctrl-group { display: flex; align-items: center; gap: 10px; }
    .icon-btn {
        background: rgba(255, 255, 255, 0.06); border: 1px solid var(--border); color: #fff; width: 36px; height: 36px; border-radius: 10px;
        display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s ease;
    }
    .icon-btn:hover { background: rgba(56, 189, 248, 0.15); border-color: var(--accent-cyan); }
    .icon-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; }
    .vol-slider-wrap { display: flex; align-items: center; gap: 6px; }
    .vol-slider { width: 75px; accent-color: var(--accent-cyan); cursor: pointer; }

    @media (max-width: 768px) {
        body { padding: 6px; }
        .tv-screen-wrapper { border-radius: 14px; }
        .viewer-bar { padding: 8px 12px; gap: 8px; flex-wrap: wrap; }
        .vol-slider { width: 55px; }
        .live-status-pill { display: none; }
        .btn-play-tv { padding: 8px 14px; font-size: 0.75rem; }

        .tv-watermark-wrap { top: 14px !important; right: 16px !important; transform: scale(0.80) !important; }
        .tv-age-rating-container { bottom: 24px !important; right: 16px !important; transform: scale(0.85) !important; }
        .tv-morning-info-panel { bottom: 12px !important; left: 12px !important; width: calc(100% - 24px) !important; max-width: none !important; }
    }
</style>
</head>
<body oncontextmenu="return false;">

<div class="player-wrapper">

    <!-- 📺 DUAL-DECK TV KÉPERNYŐ -->
    <div class="tv-screen-wrapper" id="tv-screen-container">
        <video id="tv-video-deck-a" class="tv-video-deck active" playsinline preload="auto" webkit-playsinline></video>
        <video id="tv-video-deck-b" class="tv-video-deck" playsinline preload="auto" webkit-playsinline></video>

        <!-- 📺 MONOSZKÓP -->
        <div class="tv-monoscope-layer" id="tv-monoscope-layer">
            <svg class="monoscope-svg" viewBox="0 0 1000 562.5" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <clipPath id="circleClip"><circle cx="500" cy="281.25" r="225"/></clipPath>
                    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">

                </defs>
                <rect width="1000" height="562.5" fill="#004b93"/>

                <g clip-path="url(#circleClip)">
                    <rect x="250" y="50" width="500" height="462.5" fill="#f5f5f5"/>
                    <g transform="translate(275, 145)">
                        <rect x="0" width="64.28" height="75" fill="#ffd700"/>
                        <rect x="64.28" width="64.28" height="75" fill="#00d4cf"/>
                        <rect x="128.56" width="64.28" height="75" fill="#00cf00"/>
                        <rect x="192.84" width="64.28" height="75" fill="#d400d4"/>
                        <rect x="257.12" width="64.28" height="75" fill="#cf0000"/>
                        <rect x="321.4" width="64.28" height="75" fill="#0000cf"/>
                        <rect x="385.68" width="64.32" height="75" fill="#111111"/>
                    </g>
                    <rect x="275" y="220" width="450" height="125" fill="#111111"/>
                    <rect x="475" y="415" width="50" height="100" fill="#dc2626"/>
                    <line x1="275" y1="281.25" x2="725" y2="281.25" stroke="#ffffff" stroke-width="2"/>
                    <line x1="500" y1="220" x2="500" y2="345" stroke="#ffffff" stroke-width="2"/>
                </g>
                <circle cx="500" cy="281.25" r="225" fill="none" stroke="#ffffff" stroke-width="4"/>
                <rect x="300" y="80" width="400" height="48" rx="6" fill="#050811" stroke="#ffffff" stroke-width="2.5"/>
                <text x="320" y="111" font-family="'Space Mono', monospace" font-size="18" font-weight="800" fill="#ffffff" letter-spacing="1">KÉPBEN! MUSIC</text>
                <text x="680" y="111" id="mono-live-clock" font-family="'Space Mono', monospace" font-size="18" font-weight="800" fill="#38bdf8" letter-spacing="1" text-anchor="end">--:--:--</text>
            </svg>
        </div>

        <!-- ⏳ VÁRAKOZÓ KÉPERNYŐ -->
        <div class="tv-standby-screen" id="tv-standby-screen">
            <div class="standby-content-box">
                <span class="standby-brand">KÉPBEN<span style="color:#ef4444;">!</span>MUSIC</span>
                <div class="standby-msg">Hamarosan folytatjuk, várható kezdés:</div>
                <div class="standby-time-badge" id="standby-resume-time">--:--:--</div>
            </div>
        </div>

        <!-- ☕🌅 REGGELI HÍR- ÉS IDŐJÁRÁS SÁV -->
        <div class="tv-morning-info-panel" id="tv-morning-info-panel">
            <div class="info-header-row">
                <div class="info-badge-title">
                    <svg class="coffee-cup-svg" viewBox="0 0 24 24">
                        <path d="M18 8h1a4 4 0 0 1 0 8h-1"/>
                        <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"/>
                        <line x1="6" y1="1" x2="6" y2="4"/>
                        <line x1="10" y1="1" x2="10" y2="4"/>
                        <line x1="14" y1="1" x2="14" y2="4"/>
                    </svg>
                    <span id="morning-info-title-tab">ÉBREDJ KÉPBEN!</span>
                    <span id="morning-info-clock" style="color:#fde68a; font-size:0.65rem;">--:--</span>
                </div>
                <div class="info-live-rates" id="morning-rates-display">
                    <span>EUR: 395.4</span>
                    <span>USD: 362.1</span>
                </div>
            </div>

            <div class="info-news-box" id="info-news-box">
                <div style="display:flex; align-items:center; gap:5px;">
                    <span class="info-source-tag" id="info-news-source">KÉPBEN! HÍREK</span>
                    <span style="font-family:'Space Mono',monospace; font-size:0.6rem; color:#fde68a;" id="info-news-time">Friss</span>
                </div>
                <div class="info-news-headline" id="info-news-headline">Élő hírek betöltése...</div>
            </div>

            <div class="info-weather-box" id="info-weather-box">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <div>
                        <div class="weather-city-name" id="weather-city-name">Budapest</div>
                        <div class="weather-cond-desc" id="weather-cond-desc">☀️ Tiszta idő</div>
                    </div>
                    <div class="weather-temp-badge" id="weather-temp-main">+18°C</div>
                </div>
            </div>
        </div>

        <!-- 🏷️ JOBB FELSŐ LOGÓ & 3D FLIP KÁRTYA -->
        <div class="tv-watermark-wrap" id="tv-watermark-wrap">
            <div style="display:flex; align-items:center;">
                <div class="tv-watermark-clean">
                    <svg class="kb-icon-mini" viewBox="0 0 24 24">
                        <path d="M3 8V5a2 2 0 0 1 2-2h3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M21 16v3a2 2 0 0 1-2 2h-3"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                    <span class="tv-watermark-text-clean">KÉPBEN<span style="color:#ef4444;">!</span><span style="color:#38bdf8; margin-left:1px;">MUSIC</span></span>
                    <span class="live-dot-static"></span>
                </div>
                <div class="tv-morning-clock" id="tv-morning-clock">07:15</div>
            </div>

            <div class="tv-flip-container">
                <div class="tv-flip-card" id="tv-flip-card">
                    <div class="flip-header-row">
                        <span class="flip-status-badge badge-most" id="flip-status-badge">MOST</span>
                        <span class="flip-show-name" id="flip-show-name">☀️ KÉPBEN! Délelőtt</span>
                    </div>
                    <div class="flip-track-title" id="flip-track-title">-</div>
                </div>
            </div>
        </div>

        <!-- 🟡🔴 KORHATÁR KARIKA -->
        <div class="tv-age-rating-container" id="tv-age-rating-container">
            <div class="nmhh-ring ring-yellow" id="nmhh-ring-box">
                <span class="nmhh-number" id="nmhh-number-text">12</span>
            </div>
        </div>
    </div>

    <!-- 🎮 NÉZŐI VEZÉRLŐSÁV -->
    <div class="viewer-bar">
        <button class="btn-play-tv" id="btn-toggle-play" onclick="toggleViewerPlayback()">
            <span id="play-icon">▶</span>
            <span id="play-text">ADÁS INDÍTÁSA</span>
        </button>

        <div class="live-status-pill" id="live-status-badge">
            <span class="live-dot-static"></span>
            <span id="live-status-text">OFFLINE</span>
        </div>

        <div class="ctrl-group">
            <div class="vol-slider-wrap">
                <button class="icon-btn" onclick="toggleMute()" title="Némítás">
                    <svg viewBox="0 0 24 24" id="vol-icon">
                        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
                    </svg>
                </button>
                <input type="range" class="vol-slider" min="0" max="1" step="0.05" value="0.9" oninput="setTvVolume(this.value)" id="vol-slider">
            </div>

            <button class="icon-btn" onclick="togglePiP()" title="Kép a képben (PiP)">
                <svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><rect x="12" y="10" width="8" height="8" rx="1"/></svg>
            </button>

            <button class="icon-btn" onclick="toggleFullscreen()" title="Teljes képernyő">
                <svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
            </button>
        </div>
    </div>

</div>

<script>
    // 🛡️ BIZTONSÁGI TILTÁSOK
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', e => {
        if (
            e.key === 'F12' || 
            (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J' || e.key === 'C')) || 
            (e.ctrlKey && (e.key === 'u' || e.key === 'U' || e.key === 's' || e.key === 'S'))
        ) {
            e.preventDefault();
            return false;
        }
    });

    const WORKER_URL = "https://kepbenoszlop.androjid21.workers.dev";
    const FIREBASE_URL = "https://hiroszlop-default-rtdb.europe-west1.firebasedatabase.app";
    const VIDEO_CROSSFADE_SEC = 5;

    let weekSchedules = {};
    let isTvBroadcasting = false;
    let isViewerPlaying = false;
    let currentClipIndex = -1;
    let currentlyPlayingId = null;
    let isMonoscopeActive = false;
    let activeDeckName = 'A';
    let isVideoTransitioning = false;
    let transitionLock = false;
    let masterVolume = 0.9;
    let isMuted = false;

    // Felhőből érkező grafikai állapotok
    let isLogoVisible = true;
    let currentAgeRating = "12";
    let cloudPositions = null;

    let isEndSequenceRunning = false;
    let flipHideTimeout = null;
    let flipSequenceTimers = [];

    let isMorningInfoVisible = false;
    let cachedNewsItems = [];
    let cachedWeatherData = [];
    let currentNewsIndex = 0;
    let currentWeatherCityIndex = 0;
    let morningCycleInterval = null;

    let audioCtx = null;
    let masterGainNode = null;
    let isAudioInitialized = false;

    const deckA = document.getElementById('tv-video-deck-a');
    const deckB = document.getElementById('tv-video-deck-b');
    const tvScreenContainer = document.getElementById('tv-screen-container');
    const monoscopeLayer = document.getElementById('tv-monoscope-layer');
    const standbyScreen = document.getElementById('tv-standby-screen');
    const standbyResumeTimeEl = document.getElementById('standby-resume-time');
    const watermarkWrap = document.getElementById('tv-watermark-wrap');
    const morningClockEl = document.getElementById('tv-morning-clock');
    const flipCardEl = document.getElementById('tv-flip-card');
    const flipStatusBadge = document.getElementById('flip-status-badge');
    const flipShowName = document.getElementById('flip-show-name');
    const flipTrackTitle = document.getElementById('flip-track-title');
    const ageRatingContainer = document.getElementById('tv-age-rating-container');
    const nmhhRingBox = document.getElementById('nmhh-ring-box');

    const morningInfoPanel = document.getElementById('tv-morning-info-panel');
    const morningInfoTitleTab = document.getElementById('morning-info-title-tab');
    const morningInfoClock = document.getElementById('morning-info-clock');
    const morningRatesDisplay = document.getElementById('morning-rates-display');
    const infoNewsBox = document.getElementById('info-news-box');
    const infoNewsSource = document.getElementById('info-news-source');
    const infoNewsHeadline = document.getElementById('info-news-headline');
    const infoWeatherBox = document.getElementById('info-weather-box');
    const weatherCityName = document.getElementById('weather-city-name');
    const weatherCondDesc = document.getElementById('weather-cond-desc');
    const weatherTempMain = document.getElementById('weather-temp-main');

    const tvDaypartConfig = {
        reggel: { title: "🌅 Ébredj KÉPBEN!", primaryColor: "#f59e0b", gradient: "linear-gradient(135deg, rgba(30, 41, 59, 0.96) 0%, rgba(245, 158, 11, 0.90) 100%)" },
        delelott: { title: "☀️ KÉPBEN! Délelőtt", primaryColor: "#38bdf8", gradient: "linear-gradient(135deg, rgba(15, 23, 42, 0.96) 0%, rgba(2, 132, 199, 0.90) 100%)" },
        delutan: { title: "🌆 KÉPBEN! Délután", primaryColor: "#06b6d4", gradient: "linear-gradient(135deg, rgba(15, 23, 42, 0.96) 0%, rgba(8, 145, 178, 0.90) 100%)" },
        party: { title: "🎉 KÉPBEN! Party", primaryColor: "#c084fc", gradient: "linear-gradient(135deg, rgba(15, 23, 42, 0.96) 0%, rgba(168, 85, 247, 0.90) 100%)" },
        ejjel: { title: "🌙 KÉPBEN! Éjszaka", primaryColor: "#818cf8", gradient: "linear-gradient(135deg, rgba(6, 9, 15, 0.98) 0%, rgba(30, 27, 75, 0.94) 100%)" }
    };

    function getDaypartKeyForHour(hour) {
        if (hour >= 6 && hour < 10) return 'reggel';
        if (hour >= 10 && hour < 14) return 'delelott';
        if (hour >= 14 && hour < 18) return 'delutan';
        if (hour >= 18 && hour < 22) return 'party';
        return 'ejjel';
    }

    function getSelectedDateKey(dayOffset) {
        const d = new Date();
        d.setDate(d.getDate() + dayOffset);
        return d.toLocaleDateString('sv-SE');
    }

    function setupAudioNodes() {
        if (isAudioInitialized) return;
        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            masterGainNode = audioCtx.createGain();
            masterGainNode.gain.setValueAtTime(masterVolume, audioCtx.currentTime);
            masterGainNode.connect(audioCtx.destination);
            isAudioInitialized = true;
        } catch(e) {}
    }

    function setTvVolume(val) {
        masterVolume = parseFloat(val);
        if (isMuted && masterVolume > 0) isMuted = false;
        deckA.volume = isMuted ? 0 : masterVolume;
        deckB.volume = isMuted ? 0 : masterVolume;
    }

    function toggleMute() {
        isMuted = !isMuted;
        deckA.volume = isMuted ? 0 : masterVolume;
        deckB.volume = isMuted ? 0 : masterVolume;
        document.getElementById('vol-slider').value = isMuted ? 0 : masterVolume;
    }

    function toggleViewerPlayback() {
        setupAudioNodes();
        isViewerPlaying = !isViewerPlaying;

        const btn = document.getElementById('btn-toggle-play');
        const icon = document.getElementById('play-icon');
        const text = document.getElementById('play-text');

        if (isViewerPlaying) {
            btn.style.background = 'var(--accent-red)';
            btn.style.color = '#fff';
            icon.textContent = '⏹';
            text.textContent = 'LEÁLLÍTÁS';

            const now = new Date();
            const currentSecToday = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
            const todayKey = getSelectedDateKey(0);
            checkScheduleAndPlayback(currentSecToday, weekSchedules[todayKey] || []);
        } else {
            btn.style.background = 'var(--accent-cyan)';
            btn.style.color = '#030712';
            icon.textContent = '▶';
            text.textContent = 'ADÁS INDÍTÁSA';

            deckA.pause();
            deckB.pause();
            deckA.src = "";
            deckB.src = "";
            hideMonoscope();
            hideStandby();
            hideFlipCardImmediate();
            hideMorningInfoBlock();
            currentlyPlayingId = null;
            currentClipIndex = -1;
            watermarkWrap.style.display = 'none';
            ageRatingContainer.style.display = 'none';
        }
    }

    function updateClock() {
        const now = new Date();
        const h = String(now.getHours()).padStart(2, '0');
        const m = String(now.getMinutes()).padStart(2, '0');
        const s = String(now.getSeconds()).padStart(2, '0');

        const monoClock = document.getElementById('mono-live-clock');
        if (monoClock) monoClock.textContent = `${h}:${m}:${s}`;
        if (morningInfoClock) morningInfoClock.textContent = `${h}:${m}`;

        const currentSecToday = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
        const hourNum = now.getHours();

        if (hourNum >= 6 && hourNum < 10) {
            morningClockEl.textContent = `${h}:${m}`;
            morningClockEl.classList.add('active');
        } else {
            morningClockEl.classList.remove('active');
            if (isMorningInfoVisible) hideMorningInfoBlock();
        }

        const curCat = getDaypartKeyForHour(hourNum);
        applyDaypartTheme(curCat);

        if (isViewerPlaying && !currentlyPlayingId && !isVideoTransitioning && !transitionLock) {
            const todayKey = getSelectedDateKey(0);
            checkScheduleAndPlayback(currentSecToday, weekSchedules[todayKey] || []);
        }
    }
    setInterval(updateClock, 1000);

    function applyDaypartTheme(cat) {
        const conf = tvDaypartConfig[cat] || tvDaypartConfig.delelott;
        document.documentElement.style.setProperty('--theme-primary', conf.primaryColor);
        document.documentElement.style.setProperty('--theme-gradient', conf.gradient);
    }

    function checkScheduleAndPlayback(currentSecToday, schedule) {
        if (!isViewerPlaying || transitionLock) return;

        if (!schedule || schedule.length === 0 || !isTvBroadcasting) {
            showMonoscope();
            return;
        }

        const foundIdx = schedule.findIndex(item => currentSecToday >= item.startSec && currentSecToday < item.endSec);

        if (foundIdx !== -1) {
            hideStandby();
            hideMonoscope();

            const activeDeck = activeDeckName === 'A' ? deckA : deckB;
            const clip = schedule[foundIdx];

            if (currentlyPlayingId === clip.id && !activeDeck.paused) return;

            currentClipIndex = foundIdx;
            currentlyPlayingId = clip.id;
            isEndSequenceRunning = false;
            const offsetSec = Math.max(0, currentSecToday - clip.startSec);

            activeDeck.src = clip.url;
            activeDeck.style.opacity = '1';
            activeDeck.style.zIndex = '2';
            activeDeck.classList.add('active');

            activeDeck.onloadedmetadata = () => {
                if (offsetSec > 0 && offsetSec < activeDeck.duration) {
                    activeDeck.currentTime = offsetSec;
                }
            };

            activeDeck.volume = isMuted ? 0 : masterVolume;
            activeDeck.play().catch(() => {});

            if (offsetSec < 12) {
                setTimeout(() => {
                    trigger3DFlipCard("MOST", clip.title, getDaypartKeyForHour(new Date().getHours()), 7000);
                }, 600);
            }

            applyVisuals();
            preloadNextDeckClip(schedule);
        } else {
            let nextClip = schedule.find(item => item.startSec > currentSecToday) || schedule[0];
            showStandby(nextClip ? nextClip.startTimeStr : null);
        }
    }

    function applyVisuals() {
        watermarkWrap.style.display = (isViewerPlaying && isLogoVisible) ? 'flex' : 'none';
        applyAgeRating(currentAgeRating);
        applyCloudPositions();
    }

    function applyCloudPositions() {
        if (window.innerWidth <= 768) return;

        const b = cloudPositions?.rating_pos_b || "60";
        const r = cloudPositions?.rating_pos_r || "32";
        const s = cloudPositions?.rating_pos_s || "38";

        const lt = cloudPositions?.logo_pos_t || "28";
        const lr = cloudPositions?.logo_pos_r || "38";
        const ls = cloudPositions?.logo_scale || "100";

        ageRatingContainer.style.bottom = `${b}px`;
        ageRatingContainer.style.right = `${r}px`;
        nmhhRingBox.style.width = `${s}px`;
        nmhhRingBox.style.height = `${s}px`;

        const numEl = nmhhRingBox.querySelector('.nmhh-number');
        if (numEl) numEl.style.fontSize = `${s * 0.46}px`;

        watermarkWrap.style.top = `${lt}px`;
        watermarkWrap.style.right = `${lr}px`;
        watermarkWrap.style.transform = `scale(${ls / 100})`;
    }

    function applyAgeRating(rating) {
        currentAgeRating = rating;
        if (rating === 'none' || !rating || !isViewerPlaying) {
            ageRatingContainer.style.display = 'none';
            return;
        }
        ageRatingContainer.style.display = 'flex';
        if (rating === '0') {
            nmhhRingBox.className = 'nmhh-ring';
            nmhhRingBox.style.border = 'none';
            nmhhRingBox.innerHTML = `<svg class="nmhh-child-svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" stroke="#22c55e" stroke-width="8" fill="transparent"/><circle cx="36" cy="40" r="6.5" fill="#22c55e"/><circle cx="64" cy="40" r="6.5" fill="#22c55e"/><path d="M 32 60 Q 50 82 68 60" stroke="#22c55e" stroke-width="8" fill="transparent" stroke-linecap="round"/></svg>`;
        } else if (rating === '18') {
            nmhhRingBox.className = 'nmhh-ring ring-red';
            nmhhRingBox.style.border = '5.5px solid #ef4444';
            nmhhRingBox.innerHTML = `<span class="nmhh-number">18</span>`;
        } else {
            nmhhRingBox.className = 'nmhh-ring ring-yellow';
            nmhhRingBox.style.border = '5.5px solid #facc15';
            nmhhRingBox.innerHTML = `<span class="nmhh-number">${rating}</span>`;
        }
    }

    function showStandby(resumeTimeStr) {
        if (!isViewerPlaying) return;
        deckA.pause(); deckB.pause();
        deckA.src = ""; deckB.src = "";
        hideMonoscope();
        hideFlipCardImmediate();
        hideMorningInfoBlock();
        currentlyPlayingId = null;
        currentClipIndex = -1;

        standbyScreen.classList.add('active');
        standbyResumeTimeEl.textContent = resumeTimeStr ? `${resumeTimeStr}-kor` : "--:--:--";
    }

    function hideStandby() { standbyScreen.classList.remove('active'); }

    function showMonoscope() {
        if (!isMonoscopeActive && isViewerPlaying) {
            isMonoscopeActive = true;
            currentlyPlayingId = null;
            currentClipIndex = -1;
            deckA.pause(); deckB.pause();
            deckA.src = ""; deckB.src = "";
            hideFlipCardImmediate();
            hideMorningInfoBlock();
            hideStandby();
            monoscopeLayer.classList.add('active');
        }
    }

    function hideMonoscope() {
        if (!isMonoscopeActive) return;
        isMonoscopeActive = false;
        monoscopeLayer.classList.remove('active');
    }

    function attachVideoDeckListeners(deck, deckLetter) {
        deck.ontimeupdate = () => {
            if (activeDeckName !== deckLetter || !deck.duration || isMonoscopeActive || isVideoTransitioning || !isViewerPlaying || transitionLock) return;
            const curTime = deck.currentTime;
            const remaining = deck.duration - curTime;
            const todayKey = getSelectedDateKey(0);
            const schedule = weekSchedules[todayKey] || [];
            const hourNow = new Date().getHours();
            const isMorningTime = (hourNow >= 6 && hourNow < 10);

            if (isMorningTime) {
                if (curTime >= 9 && remaining > 28 && !isEndSequenceRunning) {
                    if (!isMorningInfoVisible) showMorningInfoBlock();
                } else if (remaining <= 28) {
                    if (isMorningInfoVisible) hideMorningInfoBlock();
                }
            } else {
                if (isMorningInfoVisible) hideMorningInfoBlock();
            }

            if (remaining <= 26 && remaining > 6 && !isEndSequenceRunning) {
                const curClip = schedule[currentClipIndex];
                runEndTrackFlipSequence(schedule, curClip);
            }

            if (remaining <= VIDEO_CROSSFADE_SEC && remaining > 0.3 && schedule.length > 1) {
                executeVideoCrossfade();
            }
        };

        deck.onended = () => {
            if (activeDeckName === deckLetter && !isVideoTransitioning && !transitionLock) {
                executeVideoCrossfade(true);
            }
        };
    }
    attachVideoDeckListeners(deckA, 'A');
    attachVideoDeckListeners(deckB, 'B');

    function preloadNextDeckClip(schedule) {
        if (schedule.length === 0) return;
        const nextClip = schedule[(currentClipIndex + 1) % schedule.length];
        const inactiveDeck = activeDeckName === 'A' ? deckB : deckA;
        if (inactiveDeck && nextClip) {
            inactiveDeck.src = nextClip.url;
            inactiveDeck.currentTime = 0;
            inactiveDeck.volume = 0;
            inactiveDeck.style.opacity = '0';
            inactiveDeck.load();
        }
    }

    function executeVideoCrossfade(forceImmediate = false) {
        const todayKey = getSelectedDateKey(0);
        const schedule = weekSchedules[todayKey] || [];
        if (isVideoTransitioning || transitionLock || schedule.length === 0) return;

        isVideoTransitioning = true;
        transitionLock = true;
        hideFlipCardImmediate();
        hideMorningInfoBlock();

        const currentDeck = activeDeckName === 'A' ? deckA : deckB;
        const nextDeck = activeDeckName === 'A' ? deckB : deckA;
        const nextDeckName = activeDeckName === 'A' ? 'B' : 'A';

        currentClipIndex = (currentClipIndex + 1) % schedule.length;
        const newClip = schedule[currentClipIndex];
        currentlyPlayingId = newClip.id;

        if (!nextDeck.src || nextDeck.src === '') nextDeck.src = newClip.url;

        nextDeck.currentTime = 0;
        nextDeck.volume = (forceImmediate || isMuted) ? (isMuted ? 0 : masterVolume) : 0;
        nextDeck.style.opacity = forceImmediate ? '1' : '0';
        nextDeck.classList.add('active');
        nextDeck.play().catch(() => {});

        if (forceImmediate) {
            currentDeck.classList.remove('active');
            currentDeck.pause();
            currentDeck.src = "";
            activeDeckName = nextDeckName;
            isVideoTransitioning = false;
            setTimeout(() => {
                transitionLock = false;
                trigger3DFlipCard("MOST", newClip.title, getDaypartKeyForHour(new Date().getHours()), 7000);
            }, 600);
            preloadNextDeckClip(schedule);
            return;
        }

        const fadeSteps = 40;
        const fadeStepTime = (VIDEO_CROSSFADE_SEC * 1000) / fadeSteps;
        let step = 0;

        const fadeTimer = setInterval(() => {
            step++;
            const progress = step / fadeSteps;

            if (!isMuted) {
                currentDeck.volume = Math.max(0, masterVolume * (1 - progress));
                nextDeck.volume = Math.min(masterVolume, masterVolume * progress);
            }

            currentDeck.style.opacity = (1 - progress).toFixed(3);
            nextDeck.style.opacity = progress.toFixed(3);

            if (step >= fadeSteps) {
                clearInterval(fadeTimer);
                currentDeck.pause();
                currentDeck.src = "";
                currentDeck.classList.remove('active');
                nextDeck.classList.add('active');
                nextDeck.style.opacity = '1';
                if (!isMuted) nextDeck.volume = masterVolume;

                activeDeckName = nextDeckName;
                isVideoTransitioning = false;

                setTimeout(() => {
                    transitionLock = false;
                    trigger3DFlipCard("MOST", newClip.title, getDaypartKeyForHour(new Date().getHours()), 7000);
                }, 600);
                preloadNextDeckClip(schedule);
            }
        }, fadeStepTime);
    }

    function trigger3DFlipCard(type, title, showCat, durationMs = 5000) {
        if (!isViewerPlaying || !isLogoVisible) return;
        clearTimeout(flipHideTimeout);
        const showConfig = tvDaypartConfig[showCat] || tvDaypartConfig.delelott;
        applyDaypartTheme(showCat);

        flipCardEl.classList.remove('flip-show');
        flipCardEl.classList.add('flip-hide');

        setTimeout(() => {
            flipStatusBadge.className = `flip-status-badge badge-${type.toLowerCase()}`;
            flipStatusBadge.textContent = type;
            flipShowName.textContent = showConfig.title;
            flipTrackTitle.textContent = title;

            flipCardEl.classList.remove('flip-hide');
            flipCardEl.classList.add('flip-show');

            flipHideTimeout = setTimeout(() => {
                flipCardEl.classList.remove('flip-show');
                flipCardEl.classList.add('flip-hide');
            }, durationMs);
        }, 200);
    }

    function hideFlipCardImmediate() {
        clearTimeout(flipHideTimeout);
        flipSequenceTimers.forEach(t => clearTimeout(t));
        flipSequenceTimers = [];
        isEndSequenceRunning = false;
        flipCardEl.classList.remove('flip-show');
        flipCardEl.classList.add('flip-hide');
    }

    function runEndTrackFlipSequence(schedule, curClip) {
        if (isEndSequenceRunning || !isViewerPlaying || !isLogoVisible) return;
        isEndSequenceRunning = true;
        hideMorningInfoBlock();

        const curCat = getDaypartKeyForHour(new Date().getHours());
        const nextClip = schedule[(currentClipIndex + 1) % schedule.length];
        const laterClip = schedule[(currentClipIndex + 2) % schedule.length];

        if (curClip) trigger3DFlipCard("MOST", curClip.title, curCat, 5000);

        flipSequenceTimers.push(setTimeout(() => {
            if (nextClip && isViewerPlaying) trigger3DFlipCard("KÖVETKEZIK", nextClip.title, curCat, 5000);
        }, 5500));

        flipSequenceTimers.push(setTimeout(() => {
            if (laterClip && isViewerPlaying) trigger3DFlipCard("KÉSŐBB", laterClip.title, curCat, 5000);
        }, 11000));

        flipSequenceTimers.push(setTimeout(() => {
            hideFlipCardImmediate();
        }, 16500));
    }

    function showMorningInfoBlock() {
        if (!isViewerPlaying || isVideoTransitioning || isEndSequenceRunning || isMorningInfoVisible) return;
        isMorningInfoVisible = true;
        morningInfoPanel.classList.add('info-show');
        renderCurrentNewsCard();

        if (morningCycleInterval) clearInterval(morningCycleInterval);
        let step = 0;
        morningCycleInterval = setInterval(() => {
            if (!isMorningInfoVisible) return;
            step = (step + 1) % 4;
            if (step < 3) {
                infoWeatherBox.classList.remove('active');
                infoNewsBox.style.display = 'flex';
                morningInfoTitleTab.textContent = "ÉBREDJ KÉPBEN!";
                currentNewsIndex = (currentNewsIndex + 1) % (cachedNewsItems.length || 1);
                renderCurrentNewsCard();
            } else {
                infoNewsBox.style.display = 'none';
                infoWeatherBox.classList.add('active');
                morningInfoTitleTab.textContent = "ÉLŐ IDŐJÁRÁS";
                currentWeatherCityIndex = (currentWeatherCityIndex + 1) % (cachedWeatherData.length || 1);
                renderCurrentWeatherCard();
            }
        }, 5000);
    }

    function hideMorningInfoBlock() {
        if (!isMorningInfoVisible) return;
        isMorningInfoVisible = false;
        if (morningCycleInterval) clearInterval(morningCycleInterval);
        morningInfoPanel.classList.remove('info-show');
    }

    function renderCurrentNewsCard() {
        if (cachedNewsItems.length === 0) return;
        const item = cachedNewsItems[currentNewsIndex % cachedNewsItems.length];
        infoNewsSource.textContent = item.source || "HÍREK";
        infoNewsHeadline.textContent = item.title;
    }

    function renderCurrentWeatherCard() {
        if (cachedWeatherData.length === 0) return;
        const item = cachedWeatherData[currentWeatherCityIndex % cachedWeatherData.length];
        weatherCityName.textContent = item.name;
        weatherTempMain.textContent = `${item.temp > 0 ? '+' : ''}${item.temp.toFixed(1)}°C`;
        weatherCondDesc.textContent = `${item.icon} ${item.desc}`;
    }

    async function fetchNews() {
        try {
            const res = await fetch(`${WORKER_URL}?_t=${Date.now()}`);
            if (res.ok) {
                const data = await res.json();
                if (data.rates?.current) {
                    morningRatesDisplay.innerHTML = `<span>EUR: ${data.rates.current.eur.toFixed(1)}</span><span>USD: ${data.rates.current.usd.toFixed(1)}</span>`;
                }
                if (data.news) {
                    const list = Object.values(data.news).filter(i => i && i.title);
                    if (list.length > 0) cachedNewsItems = list;
                }
            }
        } catch(e) {}
    }

    async function fetchWeather() {
        try {
            const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=47.4979,47.5316,46.2530&longitude=19.0402,21.6273,20.1414&current=temperature_2m,weather_code&timezone=auto`);
            if (res.ok) {
                const data = await res.json();
                const cities = ["Budapest", "Debrecen", "Szeged"];
                cachedWeatherData = data.map((d, i) => ({
                    name: cities[i],
                    temp: d.current.temperature_2m,
                    icon: "☀️",
                    desc: "Kellemes idő"
                }));
            }
        } catch(e) {}
    }

    // ⚡ FIREBASE SSE VALÓS IDEJŰ PUSH ADATFOLYAM (AZONNALI SZINKRON)
    function listenToFirebaseRealtimeEvents() {
        // 1. Beállítások és grafikák azonnali figyelése
        const settingsSource = new EventSource(`${FIREBASE_URL}/tv_broadcast_settings.json`);
        settingsSource.addEventListener('put', e => {
            try {
                const payload = JSON.parse(e.data);
                const s = (payload.path === "/") ? payload.data : payload;
                if (s && typeof s === 'object') {
                    if (s.isBroadcasting !== undefined) isTvBroadcasting = s.isBroadcasting;
                    if (s.logo_visible !== undefined) isLogoVisible = s.logo_visible;
                    if (s.rating !== undefined) currentAgeRating = s.rating;
                    cloudPositions = s;

                    const badge = document.getElementById('live-status-badge');
                    const text = document.getElementById('live-status-text');
                    if (isTvBroadcasting) {
                        badge.classList.add('online');
                        text.textContent = 'ÉLŐ ADÁS';
                    } else {
                        badge.classList.remove('online');
                        text.textContent = 'OFFLINE';
                    }

                    if (isViewerPlaying) {
                        applyVisuals();
                        if (!isTvBroadcasting) showMonoscope();
                        else if (isMonoscopeActive) {
                            const now = new Date();
                            const currentSecToday = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
                            checkScheduleAndPlayback(currentSecToday, weekSchedules[getSelectedDateKey(0)] || []);
                        }
                    }
                }
            } catch(err) {}
        });

        // 2. Műsorrend és klipek azonnali figyelése
        const schedulesSource = new EventSource(`${FIREBASE_URL}/tv_week_schedules.json`);
        schedulesSource.addEventListener('put', e => {
            try {
                const payload = JSON.parse(e.data);
                const data = (payload.path === "/") ? payload.data : payload;
                if (data && typeof data === 'object') {
                    weekSchedules = data;
                    if (isViewerPlaying && isTvBroadcasting) {
                        const now = new Date();
                        const currentSecToday = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
                        const todaySched = weekSchedules[getSelectedDateKey(0)] || [];
                        const currentScheduledItem = todaySched.find(item => currentSecToday >= item.startSec && currentSecToday < item.endSec);

                        // Ha a stúdióban a jelenleg futó klipet módosították vagy törölték, azonnal váltson át
                        if (!currentScheduledItem || currentScheduledItem.id !== currentlyPlayingId) {
                            checkScheduleAndPlayback(currentSecToday, todaySched);
                        }
                    }
                }
            } catch(err) {}
        });
    }

    function toggleFullscreen() {
        if (!document.fullscreenElement && !document.webkitFullscreenElement) {
            if (tvScreenContainer.requestFullscreen) tvScreenContainer.requestFullscreen();
            else if (tvScreenContainer.webkitRequestFullscreen) tvScreenContainer.webkitRequestFullscreen();
        } else {
            if (document.exitFullscreen) document.exitFullscreen();
            else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        }
    }

    function togglePiP() {
        const activeDeck = activeDeckName === 'A' ? deckA : deckB;
        if (document.pictureInPictureElement) document.exitPictureInPicture();
        else if (activeDeck.requestPictureInPicture) activeDeck.requestPictureInPicture();
    }

    window.addEventListener('DOMContentLoaded', async () => {
        listenToFirebaseRealtimeEvents();
        fetchNews();
        fetchWeather();
        setInterval(fetchNews, 5 * 60 * 1000);
        setInterval(fetchWeather, 15 * 60 * 1000);
    });
</script>
</body>
</html>
