<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KÉPBEN! MUSIC TELEVISION · Élő Adás</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Mono:wght@400;700;800&display=swap" rel="stylesheet">

<style>
    :root {
        --bg-color: #050811;
        --card-bg: rgba(15, 23, 42, 0.90);
        --accent-cyan: #38bdf8;
        --accent-green: #22c55e;
        --accent-red: #ef4444;
        --accent-amber: #f59e0b;
        --accent-purple: #c084fc;
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --border: rgba(255, 255, 255, 0.12);

        /* Dinamikus Napszaki Színek */
        --theme-primary: #38bdf8;
        --theme-gradient: linear-gradient(135deg, rgba(15, 23, 42, 0.92) 0%, rgba(30, 58, 138, 0.88) 100%);
    }

    * {
        margin: 0; padding: 0; box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
        user-select: none; -webkit-user-select: none; -webkit-user-drag: none;
    }

    body {
        background: radial-gradient(circle at 50% 10%, #111827 0%, var(--bg-color) 85%);
        font-family: 'Inter', sans-serif;
        color: var(--text-main);
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 12px;
        overflow-x: hidden;
    }

    .player-wrapper {
        width: 100%;
        max-width: 1020px;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }

    /* 📺 16:9 PROFI TV KÉPERNYŐ KERET */
    .tv-screen-wrapper {
        position: relative;
        width: 100%;
        padding-top: 56.25%; /* 16:9 képarány */
        background: #000000;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 25px 65px rgba(0,0,0,0.9), 0 0 35px rgba(56, 189, 248, 0.15);
        border: 1.5px solid var(--border);
    }

    .tv-screen-wrapper:fullscreen, .tv-screen-wrapper:-webkit-full-screen {
        width: 100vw !important; height: 100vh !important;
        padding-top: 0 !important; border-radius: 0 !important; border: none !important;
    }

    .tv-video-deck {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        object-fit: cover; z-index: 1; opacity: 0; pointer-events: none;
        transition: opacity 0.35s ease;
    }
    .tv-video-deck.active { opacity: 1; z-index: 2; }

    /* 🎯 MÉRETARÁNYOS STÚDIÓ GRAFIKAI VÁSZON */
    .tv-graphics-canvas {
        position: absolute;
        top: 0; left: 0;
        width: 100%; height: 100%;
        z-index: 25;
        pointer-events: none;
        overflow: hidden;
    }

    /* 📺 MONOSZKÓP RÉTEG */
    .tv-monoscope-layer {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: 10; display: none; align-items: center; justify-content: center;
        background: #004b93; overflow: hidden;
    }
    .tv-monoscope-layer.active { display: flex; }
    .monoscope-svg { width: 100%; height: 100%; object-fit: contain; }

    /* ⏳ VÁRAKOZÓ / SZÜNET KÉPERNYŐ */
    .tv-standby-screen {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        z-index: 15; display: none; flex-direction: column; align-items: center; justify-content: center;
        background: radial-gradient(circle at 50% 50%, #0f172a 0%, #050811 90%);
        overflow: hidden; user-select: none;
    }
    .tv-standby-screen.active { display: flex; }

    .standby-content-box {
        position: relative; z-index: 5; display: flex; flex-direction: column; align-items: center; gap: 14px;
        text-align: center; padding: 24px 32px; background: rgba(15, 23, 42, 0.85);
        border: 1.5px solid rgba(56, 189, 248, 0.35); border-radius: 20px;
        backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
        box-shadow: 0 20px 50px rgba(0,0,0,0.85); max-width: 620px; width: 85%;
    }
    .standby-brand { font-family: 'Space Mono', monospace; font-weight: 900; font-size: 1.6rem; color: #fff; letter-spacing: -0.5px; }
    .standby-msg { font-size: 1rem; font-weight: 700; color: var(--text-main); }
    .standby-time-badge {
        font-family: 'Space Mono', monospace; font-size: 1.1rem; font-weight: 800; color: var(--accent-cyan);
        background: rgba(56, 189, 248, 0.15); border: 1px solid rgba(56, 189, 248, 0.45); padding: 6px 18px; border-radius: 10px;
    }

    /* 🏷️ JOBB FELSŐ KÉPBEN! VÍZJEL & 3D FLIP KÁRTYA */
    .tv-watermark-wrap {
        position: absolute;
        top: 26px; right: 32px;
        z-index: 30;
        display: none;
        flex-direction: column;
        align-items: flex-end;
        gap: 8px;
        user-select: none;
        pointer-events: none;
        transform-origin: top right;
        transition: top 0.15s ease, right 0.15s ease, transform 0.15s ease, opacity 0.25s ease;
    }

    .tv-watermark-clean {
        display: flex; align-items: center; gap: 6px;
        filter: drop-shadow(0 2px 8px rgba(0,0,0,0.95));
    }
    .kb-icon-mini {
        width: 24px; height: 24px; stroke: #38bdf8; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round;
        display: inline-block; vertical-align: middle;
    }
    .tv-watermark-text-clean {
        font-family: 'Space Mono', monospace; font-weight: 800; font-size: 1.05rem; color: #ffffff;
        letter-spacing: -0.4px; text-shadow: 0 2px 6px rgba(0,0,0,0.95); display: flex; align-items: center;
    }
    .live-dot-static {
        width: 8px; height: 8px; border-radius: 50%; background: #ef4444; box-shadow: 0 0 8px #ef4444; flex-shrink: 0; margin-left: 3px;
    }

    .tv-morning-clock {
        display: none; font-family: 'Space Mono', monospace; font-weight: 800; font-size: 0.8rem; color: #f59e0b;
        background: rgba(15, 23, 42, 0.85); padding: 2px 8px; border-radius: 6px; border: 1px solid rgba(245, 158, 11, 0.5);
        letter-spacing: 0.5px; box-shadow: 0 2px 8px rgba(0,0,0,0.6); margin-left: 6px;
    }
    .tv-morning-clock.active { display: inline-block; }

    /* 🎴 3D FLIP KÁRTYA (SLÁGER INFORMÁCIÓK) */
    .tv-flip-container { perspective: 800px; width: 360px; max-width: 42vw; display: flex; justify-content: flex-end; }
    .tv-flip-card {
        width: 100%; background: var(--theme-gradient); border-right: 4.5px solid var(--theme-primary); border-radius: 14px;
        padding: 9px 13px; backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
        border-top: 1px solid rgba(255,255,255,0.22); border-bottom: 1px solid rgba(255,255,255,0.18); border-left: 1px solid rgba(255,255,255,0.18);
        box-shadow: 0 14px 34px rgba(0,0,0,0.75), 0 0 15px rgba(56, 189, 248, 0.15); display: flex; flex-direction: column; gap: 3px;
        transform-origin: top center; transform: rotateX(-90deg) scale(0.95); opacity: 0;
        transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
    }
    .tv-flip-card.flip-show { transform: rotateX(0deg) scale(1); opacity: 1; }
    .tv-flip-card.flip-hide { transform: rotateX(90deg) scale(0.95); opacity: 0; transition: transform 0.3s ease-in, opacity 0.2s ease-in; }

    .flip-header-row { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
    .flip-status-badge {
        font-family: 'Space Mono', monospace; font-size: 0.65rem; font-weight: 800; padding: 2px 7px; border-radius: 4px; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .badge-most { background: #22c55e; color: #050811; }
    .badge-kovetkezik { background: #f59e0b; color: #050811; }
    .badge-kesobb { background: #c084fc; color: #050811; }

    .flip-show-name { font-family: 'Space Mono', monospace; font-size: 0.66rem; font-weight: 700; color: var(--theme-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    
    .flip-artist-name {
        font-family: 'Space Mono', monospace; font-size: 0.74rem; font-weight: 800; color: var(--accent-cyan);
        letter-spacing: 0.2px; line-height: 1.25; word-break: break-word; text-shadow: 0 1px 4px rgba(0,0,0,0.9);
    }
    .flip-track-title {
        font-size: 0.88rem; font-weight: 800; color: #ffffff; letter-spacing: -0.2px; line-height: 1.25;
        word-break: break-word; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; text-shadow: 0 2px 6px rgba(0,0,0,0.85);
    }

    /* 🟡🔴 KORHATÁR KARIKA */
    .tv-age-rating-container {
        position: absolute; bottom: 54px; right: 32px; z-index: 35; display: none; align-items: center; justify-content: center;
        pointer-events: none; background: transparent !important; box-shadow: none !important; opacity: 0.85; transform-origin: bottom right;
        transition: bottom 0.35s cubic-bezier(0.16, 1, 0.3, 1), right 0.15s ease, opacity 0.25s ease, transform 0.15s ease;
    }
    .tv-age-rating-container.lifted-above-ticker {
        bottom: 58px !important;
    }
    .nmhh-ring { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: transparent !important; box-sizing: border-box; }
    .nmhh-ring.ring-yellow { border: 5.5px solid #facc15 !important; }
    .nmhh-ring.ring-red { border: 5.5px solid #ef4444 !important; }
    .nmhh-number { font-family: 'Inter', sans-serif; font-weight: 900; font-size: 1.1rem; color: #ffffff !important; line-height: 1; letter-spacing: -0.5px; }
    .nmhh-child-svg { width: 38px; height: 38px; fill: #22c55e; }

    /* 📰 DISZKRÉT, 24/7 TV ALSÓ HÍRSÁV (BŐVÍTETT HÍRFOLYAMMAL) */
    .tv-news-ticker-bar {
        position: absolute;
        bottom: 0;
        left: 0;
        width: 100%;
        height: 44px;
        background: var(--theme-gradient);
        border-top: 2px solid var(--theme-primary);
        box-shadow: 0 -8px 25px rgba(0, 0, 0, 0.85);
        z-index: 34;
        display: flex;
        align-items: stretch;
        user-select: none;
        pointer-events: none;
        transform: translateY(115%);
        transition: transform 0.65s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.5s ease;
        opacity: 0;
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
    }
    .tv-news-ticker-bar.ticker-show {
        transform: translateY(0%);
        opacity: 1;
    }

    /* 🌦️ BAL SZÉLSŐ ÉLŐ IDŐJÁRÁS DOBOZ */
    .ticker-weather-block {
        background: rgba(10, 15, 29, 0.90);
        border-right: 2px solid var(--theme-primary);
        padding: 0 14px;
        display: flex;
        align-items: center;
        gap: 9px;
        flex-shrink: 0;
        z-index: 5;
        backdrop-filter: blur(16px);
        min-width: 185px;
        box-shadow: 4px 0 15px rgba(0,0,0,0.5);
    }
    .weather-box-anim {
        display: flex;
        align-items: center;
        gap: 8px;
        transition: opacity 0.35s ease, transform 0.35s ease;
    }
    .weather-box-anim.switching {
        opacity: 0;
        transform: translateY(-4px);
    }
    .weather-icon-badge { font-size: 1.22rem; line-height: 1; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.6)); }
    .weather-info-col { display: flex; flex-direction: column; line-height: 1.15; }
    .weather-city-lbl { font-family: 'Space Mono', monospace; font-size: 0.68rem; font-weight: 800; color: #ffffff; letter-spacing: 0.3px; }
    .weather-temp-lbl { font-family: 'Space Mono', monospace; font-size: 0.82rem; font-weight: 900; color: var(--theme-primary); }

    /* 🏃 NYUGODT, FOLYAMATOS FUTÁSÚ HÍRCSÍK */
    .ticker-crawl-viewport {
        flex: 1;
        overflow: hidden;
        position: relative;
        display: flex;
        align-items: center;
        background: rgba(5, 8, 17, 0.50);
        mask-image: linear-gradient(to right, transparent 0px, black 25px, black calc(100% - 25px), transparent 100%);
        -webkit-mask-image: linear-gradient(to right, transparent 0px, black 25px, black calc(100% - 25px), transparent 100%);
    }

    .ticker-crawl-track {
        display: inline-flex;
        align-items: center;
        white-space: nowrap;
        will-change: transform;
        padding-left: 100%;
        animation-name: crawlAnim;
        animation-timing-function: linear;
        animation-iteration-count: infinite;
    }

    .crawl-news-item {
        display: inline-flex;
        align-items: center;
        font-size: 0.85rem;
        color: #ffffff;
        letter-spacing: -0.1px;
        text-shadow: 0 2px 5px rgba(0,0,0,0.95);
        gap: 6px;
    }
    .crawl-news-tag {
        font-family: 'Space Mono', monospace;
        font-size: 0.62rem;
        font-weight: 900;
        color: var(--theme-primary);
        background: rgba(0,0,0,0.45);
        padding: 2px 7px;
        border-radius: 4px;
        margin-right: 4px;
        border: 1px solid rgba(255,255,255,0.12);
        white-space: nowrap;
    }
    .crawl-news-title {
        font-weight: 800;
        color: #ffffff;
    }
    .crawl-news-desc {
        font-weight: 500;
        color: #cbd5e1;
        margin-left: 4px;
    }
    .crawl-separator {
        display: inline-flex;
        align-items: center;
        margin: 0 26px;
        opacity: 0.9;
    }
    .crawl-separator .kb-icon-mini {
        width: 17px; height: 17px; stroke: var(--theme-primary);
    }

    @keyframes crawlAnim {
        0% { transform: translateX(0); }
        100% { transform: translateX(-100%); }
    }

    /* 📅 ULTRAVÉKONY, ÁTTETSZŐ 30 PERCES MŰSORELŐZETES HUD */
    .tv-upcoming-drawer {
        position: absolute;
        top: 55px;
        left: 24px;
        width: 350px;
        max-width: 48vw;
        background: linear-gradient(135deg, rgba(8, 14, 26, 0.38) 0%, rgba(15, 23, 42, 0.32) 100%);
        border-left: 4.5px solid var(--theme-primary);
        border-radius: 16px;
        padding: 12px 16px;
        backdrop-filter: blur(12px) saturate(160%);
        -webkit-backdrop-filter: blur(12px) saturate(160%);
        border-top: 1px solid rgba(255,255,255,0.14);
        border-right: 1px solid rgba(255,255,255,0.10);
        border-bottom: 1px solid rgba(255,255,255,0.10);
        box-shadow: 0 16px 36px rgba(0,0,0,0.65), 0 0 20px rgba(56, 189, 248, 0.12);
        z-index: 33;
        transform: translateX(-125%);
        opacity: 0;
        transition: transform 0.75s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.5s ease;
        user-select: none;
        pointer-events: none;
        display: flex;
        flex-direction: column;
        gap: 8px;
        transform-origin: top left;
    }
    .tv-upcoming-drawer.drawer-show {
        transform: translateX(0);
        opacity: 1;
    }
    .drawer-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid rgba(255,255,255,0.12);
        padding-bottom: 5px;
    }
    .drawer-title {
        font-family: 'Space Mono', monospace;
        font-size: 0.70rem;
        font-weight: 800;
        color: var(--theme-primary);
        letter-spacing: 0.3px;
        display: flex;
        align-items: center;
        gap: 6px;
        text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }
    .drawer-list {
        display: flex;
        flex-direction: column;
        gap: 5px;
        max-height: 220px;
        overflow: hidden;
    }
    .drawer-item {
        display: flex;
        align-items: center;
        gap: 9px;
        background: rgba(0,0,0,0.28);
        padding: 5px 8px;
        border-radius: 8px;
        border: 1px solid rgba(255,255,255,0.06);
        box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .drawer-time {
        font-family: 'Space Mono', monospace;
        font-size: 0.72rem;
        font-weight: 800;
        color: #facc15;
        background: rgba(250, 204, 21, 0.14);
        border: 1px solid rgba(250, 204, 21, 0.25);
        padding: 2px 5px;
        border-radius: 5px;
        white-space: nowrap;
    }
    .drawer-track-meta {
        display: flex;
        flex-direction: column;
        overflow: hidden;
        gap: 1px;
    }
    .drawer-track-artist {
        font-family: 'Space Mono', monospace;
        font-size: 0.64rem;
        font-weight: 800;
        color: var(--accent-cyan);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        text-shadow: 0 1px 3px rgba(0,0,0,0.8);
    }
    .drawer-track-title {
        font-size: 0.78rem;
        font-weight: 700;
        color: #ffffff;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        text-shadow: 0 1px 3px rgba(0,0,0,0.9);
    }

    /* 🎮 NÉZŐI VEZÉRLŐSÁV */
    .viewer-bar {
        background: var(--card-bg); border: 1px solid var(--border); border-radius: 18px; padding: 10px 16px;
        display: flex; align-items: center; justify-content: space-between; gap: 12px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
        box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .btn-play-tv {
        background: var(--accent-cyan); color: #030712; border: none; padding: 11px 22px; border-radius: 12px;
        font-family: 'Space Mono', monospace; font-size: 0.82rem; font-weight: 800; cursor: pointer; display: flex; align-items: center; gap: 8px;
        transition: transform 0.2s ease, background 0.2s ease; box-shadow: 0 0 15px rgba(56, 189, 248, 0.35);
    }
    .btn-play-tv:active { transform: scale(0.97); }

    .live-status-pill {
        display: flex; align-items: center; gap: 6px; font-family: 'Space Mono', monospace; font-size: 0.72rem; font-weight: 800;
        color: var(--text-muted); background: rgba(255, 255, 255, 0.05); padding: 6px 12px; border-radius: 20px; border: 1px solid var(--border);
    }
    .live-status-pill.online { color: var(--accent-green); border-color: rgba(34, 197, 94, 0.3); background: rgba(34, 197, 94, 0.1); }
    .live-status-pill.online .live-dot-static { background: var(--accent-green); box-shadow: 0 0 8px var(--accent-green); }

    .ctrl-group { display: flex; align-items: center; gap: 10px; }
    .icon-btn {
        background: rgba(255, 255, 255, 0.06); border: 1px solid var(--border); color: #fff; width: 36px; height: 36px; border-radius: 10px;
        display: flex; align-items: center; justify-content: center; cursor: pointer; transition: all 0.2s ease;
    }
    .icon-btn:hover { background: rgba(56, 189, 248, 0.15); border-color: var(--accent-cyan); }
    .icon-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; }
    .vol-slider-wrap { display: flex; align-items: center; gap: 6px; }
    .vol-slider { width: 75px; accent-color: var(--accent-cyan); cursor: pointer; }

    @media (max-width: 768px) {
        body { padding: 6px; }
        .tv-screen-wrapper { border-radius: 14px; }
        .viewer-bar { padding: 8px 12px; gap: 8px; flex-wrap: wrap; }
        .vol-slider { width: 55px; }
        .live-status-pill { display: none; }
        .btn-play-tv { padding: 8px 14px; font-size: 0.75rem; }
        .tv-upcoming-drawer { width: 280px; max-width: 85vw; left: 12px; top: 40px; }
        .ticker-weather-block { min-width: 140px; padding: 0 8px; }
    }
</style>
</head>

                    <rect x="475" y="415" width="50" height="100" fill="#dc2626"/>

    function getDaypartKeyForHour(hour) {
        if (hour >= 6 && hour < 10) return 'reggel';
        if (hour >= 10 && hour < 14) return 'delelott';
        if (hour >= 14 && hour < 18) return 'delutan';
        if (hour >= 18 && hour < 22) return 'party';

    function cleanHtmlText(raw) {
        if (!raw) return "";
        return raw.replace(/<[^>]*>?/gm, '').replace(/&nbsp;/g, ' ').replace(/\s+/g, ' ').trim();
    }

    function parseArtistAndTitle(rawTitle) {
        if (!rawTitle) return { artist: "KÉPBEN! MUSIC", title: "-" };
        let cleaned = rawTitle.replace(/\.(mp4|webm|mov|mkv)$/i, '').trim();
        let parts = [];

        if (cleaned.includes(' - ')) parts = cleaned.split(' - ');
        else if (cleaned.includes(' · ')) parts = cleaned.split(' · ');
        else if (cleaned.includes(' – ')) parts = cleaned.split(' – ');
        else if (cleaned.includes(': ')) parts = cleaned.split(': ');

        if (parts.length >= 2) {
            return {
                artist: parts[0].trim(),
                title: parts.slice(1).join(' - ').trim()
            };
        }

        return {
            artist: "KÉPBEN! SLÁGER",
            title: cleaned
        };
    }

    function getWeatherCodeInfo(code, isDay = 1) {
        const isNight = isDay === 0;
        if (code === 0) return isNight ? { icon: "🌙", text: "Tiszta, csillagos éjszaka" } : { icon: "☀️", text: "Tiszta, napos idő" };
        if (code === 1) return isNight ? { icon: "🌙⛅", text: "Alig felhős éjjel" } : { icon: "🌤️", text: "Túlnyomóan derült" };
        if (code === 2) return isNight ? { icon: "☁️🌙", text: "Változóan felhős éjjel" } : { icon: "⛅", text: "Változóan felhős" };
        if (code === 3) return { icon: "☁️", text: "Borult égbolt" };
        if (code === 45 || code === 48) return { icon: "🌫️", text: "Köd" };
        if (code >= 51 && code <= 55) return { icon: "🌦️", text: "Szitálás" };
        if (code >= 61 && code <= 65) return { icon: "🌧️", text: "Eső" };
        if (code >= 71 && code <= 77) return { icon: "❄️", text: "Hószállingózás" };
        if (code >= 80 && code <= 82) return { icon: "🌦️", text: "Záporeső" };
        if (code >= 95 && code <= 99) return { icon: "⛈️", text: "Zivatar" };
        return isNight ? { icon: "🌙", text: "Csendes éjszaka" } : { icon: "🌤️", text: "Kellemes idő" };
    }

    function setupAudioNodes() {
        if (isAudioInitialized) return;
        try {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            masterGainNode = audioCtx.createGain();
            masterGainNode.gain.setValueAtTime(masterVolume, audioCtx.currentTime);
            masterGainNode.connect(audioCtx.destination);
            isAudioInitialized = true;
        } catch(e) {}
    }

        const now = new Date();
        const h = String(now.getHours()).padStart(2, '0');
        const m = String(now.getMinutes()).padStart(2, '0');
        const s = String(now.getSeconds()).padStart(2, '0');

        const monoClock = document.getElementById('mono-live-clock');
        if (monoClock) monoClock.textContent = `${h}:${m}:${s}`;

        const currentSecToday = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
        const hourNum = now.getHours();
        const minuteNum = now.getMinutes();
        const secondNum = now.getSeconds();

        if (hourNum >= 6 && hourNum < 10) {
            morningClockEl.textContent = `${h}:${m}`;
            morningClockEl.classList.add('active');
        } else {
            morningClockEl.classList.remove('active');
        }

        const curCat = getDaypartKeyForHour(hourNum);
        applyDaypartTheme(curCat);

        // Állapotok valós idejű monitorozása
        evaluateAgeRatingVisibility(hourNum);
        evaluateNewsTickerStatus(hourNum);
        evaluateUpcomingDrawerSchedule(hourNum, minuteNum, secondNum);

        if (isViewerPlaying && !currentlyPlayingId && !isVideoTransitioning && !transitionLock) {
            const todayKey = getSelectedDateKey(0);
            checkScheduleAndPlayback(currentSecToday, weekSchedules[todayKey] || []);
        }
    }
    setInterval(updateClock, 1000);

    function applyDaypartTheme(cat) {
        const conf = tvDaypartConfig[cat] || tvDaypartConfig.delelott;
        document.documentElement.style.setProperty('--theme-primary', conf.primaryColor);
        document.documentElement.style.setProperty('--theme-gradient', conf.gradient);
    }

    function checkScheduleAndPlayback(currentSecToday, schedule) {
        if (!isViewerPlaying || transitionLock) return;

        if (!schedule || schedule.length === 0 || !isTvBroadcasting) {
            showMonoscope();
            return;
        }

        const foundIdx = schedule.findIndex(item => currentSecToday >= item.startSec && currentSecToday < item.endSec);

        if (foundIdx !== -1) {
            hideStandby();
            hideMonoscope();

            const activeDeck = activeDeckName === 'A' ? deckA : deckB;
            const clip = schedule[foundIdx];

            if (currentlyPlayingId === clip.id && !activeDeck.paused) return;

            currentClipIndex = foundIdx;
            currentlyPlayingId = clip.id;
            isEndSequenceRunning = false;
            isIntroFlipRunning = true;
            const offsetSec = Math.max(0, currentSecToday - clip.startSec);

            activeDeck.src = clip.url;
            activeDeck.style.opacity = '1';
            activeDeck.style.zIndex = '2';
            activeDeck.classList.add('active');

            activeDeck.onloadedmetadata = () => {
                if (offsetSec > 0 && offsetSec < activeDeck.duration) {
                    activeDeck.currentTime = offsetSec;
                }
            };

            activeDeck.volume = isMuted ? 0 : masterVolume;
            activeDeck.play().catch(() => {});

            if (offsetSec < 15) {
                hideNewsTicker();
                setTimeout(() => {
                    trigger3DFlipCard("MOST", clip.title, getDaypartKeyForHour(new Date().getHours()), 8000);
                }, 800);
            } else {
                isIntroFlipRunning = false;
                evaluateNewsTickerStatus(new Date().getHours());
            }

            applyVisuals();
            preloadNextDeckClip(schedule);
        } else {
            let nextClip = schedule.find(item => item.startSec > currentSecToday) || schedule[0];
            showStandby(nextClip ? nextClip.startTimeStr : null);
        }
    }

    function applyVisuals() {
        watermarkWrap.style.display = (isViewerPlaying && isLogoVisible) ? 'flex' : 'none';
        applyAgeRating(currentAgeRating);
        applyCloudPositions();
    }

    function applyAgeRating(rating) {
        currentAgeRating = rating;
        if (rating === 'none' || !rating || !isViewerPlaying) {
            ageRatingContainer.style.display = 'none';
            return;
        }

        if (rating === '0') {
            nmhhRingBox.className = 'nmhh-ring';
            nmhhRingBox.style.border = 'none';
            nmhhRingBox.innerHTML = `<svg class="nmhh-child-svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="44" stroke="#22c55e" stroke-width="8" fill="transparent"/><circle cx="36" cy="40" r="6.5" fill="#22c55e"/><circle cx="64" cy="40" r="6.5" fill="#22c55e"/><path d="M 32 60 Q 50 82 68 60" stroke="#22c55e" stroke-width="8" fill="transparent" stroke-linecap="round"/></svg>`;
        } else if (rating === '18') {
            nmhhRingBox.className = 'nmhh-ring ring-red';
            nmhhRingBox.style.border = '5.5px solid #ef4444';
            nmhhRingBox.innerHTML = `<span class="nmhh-number">18</span>`;
        } else {
            nmhhRingBox.className = 'nmhh-ring ring-yellow';
            nmhhRingBox.style.border = '5.5px solid #facc15';
            nmhhRingBox.innerHTML = `<span class="nmhh-number">${rating}</span>`;
        }

        evaluateAgeRatingVisibility(new Date().getHours());
    }

    function evaluateAgeRatingVisibility(hour) {
        if (!isViewerPlaying || currentAgeRating === 'none') {
            ageRatingContainer.style.display = 'none';
            return;
        }

        if (isRatingAutoTimerEnabled) {
            if (ratingTimerOffHour > ratingTimerOnHour) {
                if (hour >= ratingTimerOffHour || hour < ratingTimerOnHour) {
                    ageRatingContainer.style.display = 'none';
                    return;
                }
            } else {
                if (hour >= ratingTimerOffHour && hour < ratingTimerOnHour) {
                    ageRatingContainer.style.display = 'none';
                    return;
                }
            }
        }

        ageRatingContainer.style.display = 'flex';
    }

    function showStandby(resumeTimeStr) {
        if (!isViewerPlaying) return;
        deckA.pause(); deckB.pause();
        deckA.src = ""; deckB.src = "";
        hideMonoscope();
        hideFlipCardImmediate();
        hideNewsTicker();
        upcomingDrawer.classList.remove('drawer-show');
        currentlyPlayingId = null;
        currentClipIndex = -1;

        standbyScreen.classList.add('active');
        standbyResumeTimeEl.textContent = resumeTimeStr ? `${resumeTimeStr}-kor` : "--:--:--";
    }

    function hideStandby() { standbyScreen.classList.remove('active'); }

    function showMonoscope() {
        if (!isMonoscopeActive && isViewerPlaying) {
            isMonoscopeActive = true;
            currentlyPlayingId = null;
            currentClipIndex = -1;
            deckA.pause(); deckB.pause();
            deckA.src = ""; deckB.src = "";
            hideFlipCardImmediate();
            hideNewsTicker();
            upcomingDrawer.classList.remove('drawer-show');
            hideStandby();
            monoscopeLayer.classList.add('active');
        }
    }

    function hideMonoscope() {
        if (!isMonoscopeActive) return;
        isMonoscopeActive = false;
        monoscopeLayer.classList.remove('active');
    }

    function attachVideoDeckListeners(deck, deckLetter) {
        deck.ontimeupdate = () => {
            if (activeDeckName !== deckLetter || !deck.duration || isMonoscopeActive || isVideoTransitioning || !isViewerPlaying || transitionLock) return;
            const curTime = deck.currentTime;
            const remaining = deck.duration - curTime;
            const todayKey = getSelectedDateKey(0);
            const schedule = weekSchedules[todayKey] || [];

            if (remaining <= 26 && remaining > 6 && !isEndSequenceRunning) {
                const curClip = schedule[currentClipIndex];
                runEndTrackFlipSequence(schedule, curClip);
            }

            if (remaining <= VIDEO_CROSSFADE_SEC && remaining > 0.3 && schedule.length > 1) {
                executeVideoCrossfade();
            }
        };

        deck.onended = () => {
            if (activeDeckName === deckLetter && !isVideoTransitioning && !transitionLock) {
                executeVideoCrossfade(true);
            }
        };
    }
    attachVideoDeckListeners(deckA, 'A');
    attachVideoDeckListeners(deckB, 'B');

    function preloadNextDeckClip(schedule) {
        if (schedule.length === 0) return;
        const nextClip = schedule[(currentClipIndex + 1) % schedule.length];
        const inactiveDeck = activeDeckName === 'A' ? deckB : deckA;
        if (inactiveDeck && nextClip) {
            inactiveDeck.src = nextClip.url;
            inactiveDeck.currentTime = 0;
            inactiveDeck.volume = 0;
            inactiveDeck.style.opacity = '0';
            inactiveDeck.load();
        }
    }

    function executeVideoCrossfade(forceImmediate = false) {
        const todayKey = getSelectedDateKey(0);
        const schedule = weekSchedules[todayKey] || [];
        if (isVideoTransitioning || transitionLock || schedule.length === 0) return;

        isVideoTransitioning = true;
        transitionLock = true;
        isIntroFlipRunning = true;
        hideFlipCardImmediate();
        hideNewsTicker();

        const currentDeck = activeDeckName === 'A' ? deckA : deckB;
        const nextDeck = activeDeckName === 'A' ? deckB : deckA;
        const nextDeckName = activeDeckName === 'A' ? 'B' : 'A';

        currentClipIndex = (currentClipIndex + 1) % schedule.length;
        const newClip = schedule[currentClipIndex];
        currentlyPlayingId = newClip.id;

        if (!nextDeck.src || nextDeck.src === '') nextDeck.src = newClip.url;

        nextDeck.currentTime = 0;
        nextDeck.volume = (forceImmediate || isMuted) ? (isMuted ? 0 : masterVolume) : 0;
        nextDeck.style.opacity = forceImmediate ? '1' : '0';
        nextDeck.classList.add('active');
        nextDeck.play().catch(() => {});

        if (forceImmediate) {
            currentDeck.classList.remove('active');
            currentDeck.pause();
            currentDeck.src = "";
            activeDeckName = nextDeckName;
            isVideoTransitioning = false;
            setTimeout(() => {
                transitionLock = false;
                trigger3DFlipCard("MOST", newClip.title, getDaypartKeyForHour(new Date().getHours()), 8000);
            }, 800);
            preloadNextDeckClip(schedule);
            return;
        }

        const fadeSteps = 50;
        const fadeStepTime = (VIDEO_CROSSFADE_SEC * 1000) / fadeSteps;
        let step = 0;

        const fadeTimer = setInterval(() => {
            step++;
            const progress = step / fadeSteps;

            if (!isMuted) {
                currentDeck.volume = Math.max(0, masterVolume * (1 - progress));
                nextDeck.volume = Math.min(masterVolume, masterVolume * progress);
            }

            currentDeck.style.opacity = (1 - progress).toFixed(3);
            nextDeck.style.opacity = progress.toFixed(3);

            if (step >= fadeSteps) {
                clearInterval(fadeTimer);
                currentDeck.pause();
                currentDeck.src = "";
                currentDeck.classList.remove('active');
                nextDeck.classList.add('active');
                nextDeck.style.opacity = '1';
                if (!isMuted) nextDeck.volume = masterVolume;

                activeDeckName = nextDeckName;
                isVideoTransitioning = false;

                setTimeout(() => {
                    transitionLock = false;
                    trigger3DFlipCard("MOST", newClip.title, getDaypartKeyForHour(new Date().getHours()), 8000);
                }, 800);
                preloadNextDeckClip(schedule);
            }
        }, fadeStepTime);
    }

    function trigger3DFlipCard(type, rawTrackTitle, showCat, durationMs = 5500) {
        if (!isViewerPlaying || !isLogoVisible) return;
        clearTimeout(flipHideTimeout);
        const showConfig = tvDaypartConfig[showCat] || tvDaypartConfig.delelott;
        applyDaypartTheme(showCat);

        const parsed = parseArtistAndTitle(rawTrackTitle);

        flipCardEl.classList.remove('flip-show');
        flipCardEl.classList.add('flip-hide');

        setTimeout(() => {
            flipStatusBadge.className = `flip-status-badge badge-${type.toLowerCase()}`;
            flipStatusBadge.textContent = type;
            flipShowName.textContent = showConfig.title;
            flipArtistName.textContent = parsed.artist;
            flipTrackTitle.textContent = parsed.title;

            flipCardEl.classList.remove('flip-hide');
            flipCardEl.classList.add('flip-show');

            flipHideTimeout = setTimeout(() => {
                flipCardEl.classList.remove('flip-show');
                flipCardEl.classList.add('flip-hide');
                isIntroFlipRunning = false;
                evaluateNewsTickerStatus(new Date().getHours());
            }, durationMs);
        }, 220);
    }

    function hideFlipCardImmediate() {
        clearTimeout(flipHideTimeout);
        flipSequenceTimers.forEach(t => clearTimeout(t));
        flipSequenceTimers = [];
        isIntroFlipRunning = false;
        isEndSequenceRunning = false;
        flipCardEl.classList.remove('flip-show');
        flipCardEl.classList.add('flip-hide');
    }

    function runEndTrackFlipSequence(schedule, curClip) {
        if (isEndSequenceRunning || !isViewerPlaying || !isLogoVisible) return;
        isEndSequenceRunning = true;
        hideNewsTicker();

        const curCat = getDaypartKeyForHour(new Date().getHours());
        const nextClip = schedule[(currentClipIndex + 1) % schedule.length];
        const laterClip = schedule[(currentClipIndex + 2) % schedule.length];

        if (curClip) trigger3DFlipCard("MOST", curClip.title, curCat, 5000);

        flipSequenceTimers.push(setTimeout(() => {
            if (nextClip && isViewerPlaying) trigger3DFlipCard("KÖVETKEZIK", nextClip.title, curCat, 5500);
        }, 5500));

        flipSequenceTimers.push(setTimeout(() => {
            if (laterClip && isViewerPlaying) trigger3DFlipCard("KÉSŐBB", laterClip.title, curCat, 5500);
        }, 11500));

        flipSequenceTimers.push(setTimeout(() => {
            hideFlipCardImmediate();
            evaluateNewsTickerStatus(new Date().getHours());
        }, 17500));
    }

    // 📰 HÍRCSÍK ÉS IDŐJÁRÁS CSENDES HÁTTÉRMOTORJA (60 VÁROS)
    async function fetchLiveNews() {
        try {
            const res = await fetch(`${WORKER_URL}?_t=${Date.now()}`);
            if (res.ok) {
                const data = await res.json();
                if (data.news && typeof data.news === 'object') {
                    const rawList = Object.values(data.news);
                    const processed = [];
                    const seen = new Set();
                    for (const item of rawList) {
                        if (!item || !item.title) continue;
                        const cleanT = cleanHtmlText(item.title);
                        const key = cleanT.toLowerCase().slice(0, 45);
                        if (seen.has(key)) continue;
                        seen.add(key);

                        let summaryText = cleanHtmlText(item.description || item.lead || item.summary || item.contentSnippet || item.content || "");
                        if (summaryText && summaryText.length > 250) {
                            summaryText = summaryText.slice(0, 245) + '...';
                        }

                        let timeMs = item.date ? new Date(item.date).getTime() : 0;
                        processed.push({
                            title: cleanT,
                            summary: summaryText,
                            source: item.source || "KÉPBEN! HÍREK",
                            timeMs: isNaN(timeMs) ? 0 : timeMs
                        });
                    }
                    processed.sort((a, b) => b.timeMs - a.timeMs);
                    if (processed.length > 0) {
                        cachedNewsItems = processed;
                        rebuildNewsTickerContent();
                    }
                }
            }
        } catch(e) {}

        if (cachedNewsItems.length === 0) {
            hideNewsTicker();
        }
    }

    async function fetchLiveWeather() {
        try {
            const lats = HUNGARY_CITIES.map(c => c.lat).join(',');
            const lons = HUNGARY_CITIES.map(c => c.lon).join(',');
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${lats}&longitude=${lons}&current=temperature_2m,weather_code,is_day&timezone=auto`;

            const res = await fetch(url);
            if (res.ok) {
                const data = await res.json();
                const items = [];
                if (Array.isArray(data)) {
                    data.forEach((cityRes, idx) => {
                        const cur = cityRes.current;
                        if (cur && HUNGARY_CITIES[idx]) {
                            const cInfo = getWeatherCodeInfo(cur.weather_code, cur.is_day);
                            items.push({
                                name: HUNGARY_CITIES[idx].name.toUpperCase(),
                                temp: cur.temperature_2m.toFixed(1),
                                icon: cInfo.icon,
                                desc: cInfo.text
                            });
                        }
                    });
                } else if (data.current) {
                    const cur = data.current;
                    const cInfo = getWeatherCodeInfo(cur.weather_code, cur.is_day);
                    items.push({
                        name: HUNGARY_CITIES[0].name.toUpperCase(),
                        temp: cur.temperature_2m.toFixed(1),
                        icon: cInfo.icon,
                        desc: cInfo.text
                    });
                }
                if (items.length > 0) {
                    cachedWeatherData = items;
                    renderCurrentWeatherCity();
                }
            }
        } catch(e) {}
    }

    function startWeatherCityRotator() {
        if (weatherCityInterval) clearInterval(weatherCityInterval);
        weatherCityInterval = setInterval(() => {
            if (cachedWeatherData.length === 0) return;
            currentWeatherCityIndex = (currentWeatherCityIndex + 1) % cachedWeatherData.length;

            weatherBoxAnim.classList.add('switching');
            setTimeout(() => {
                renderCurrentWeatherCity();
                weatherBoxAnim.classList.remove('switching');
            }, 350);
        }, 10000);
    }

    function renderCurrentWeatherCity() {
        if (cachedWeatherData.length === 0) {
            const isNight = new Date().getHours() >= 20 || new Date().getHours() < 6;
            weatherCityLbl.textContent = "BUDAPEST";
            weatherTempLbl.textContent = "+18.0°C";
            weatherIconBadge.textContent = isNight ? "🌙" : "☀️";
            return;
        }
        const c = cachedWeatherData[currentWeatherCityIndex % cachedWeatherData.length];
        weatherCityLbl.textContent = c.name;
        weatherTempLbl.textContent = `${parseFloat(c.temp) > 0 ? '+' : ''}${c.temp}°C`;
        weatherIconBadge.textContent = c.icon;
    }

    function rebuildNewsTickerContent() {
        if (!tickerCrawlTrack) return;
        if (cachedNewsItems.length === 0) {
            hideNewsTicker();
            return;
        }

        const separatorHtml = `
            <span class="crawl-separator">
                <svg class="kb-icon-mini" viewBox="0 0 24 24">
                    <path d="M3 8V5a2 2 0 0 1 2-2h3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M21 16v3a2 2 0 0 1-2 2h-3"/>
                    <circle cx="12" cy="12" r="3"/>
                </svg>
            </span>
        `;

        const itemsHtml = cachedNewsItems.map(n => `
            <span class="crawl-news-item">
                <span class="crawl-news-tag">${n.source}</span>
                <span class="crawl-news-title">${n.title}</span>
                ${n.summary ? `<span class="crawl-news-desc">— ${n.summary}</span>` : ''}
            </span>
        `).join(separatorHtml);

        tickerCrawlTrack.innerHTML = itemsHtml + separatorHtml;

        setTimeout(() => {
            const trackWidth = tickerCrawlTrack.scrollWidth;
            const targetSpeedPxPerSec = 75;
            const calculatedDuration = Math.max(50, Math.round(trackWidth / targetSpeedPxPerSec));
            tickerCrawlTrack.style.animationDuration = `${calculatedDuration}s`;
        }, 100);
    }

    function evaluateNewsTickerStatus(hour) {
        if (!isViewerPlaying || !isNewsTickerManualEnabled || cachedNewsItems.length === 0) {
            hideNewsTicker();
            return;
        }

        if (isIntroFlipRunning || isEndSequenceRunning || isVideoTransitioning) {
            hideNewsTicker();
            return;
        }

        showNewsTicker();
    }

    function showNewsTicker() {
        if (isNewsTickerVisible) return;
        isNewsTickerVisible = true;
        rebuildNewsTickerContent();
        newsTickerBar.classList.add('ticker-show');
        ageRatingContainer.classList.add('lifted-above-ticker');
    }

    function hideNewsTicker() {
        if (!isNewsTickerVisible) return;
        isNewsTickerVisible = false;
        newsTickerBar.classList.remove('ticker-show');
        ageRatingContainer.classList.remove('lifted-above-ticker');
    }

    // 📅 15 PERCENKÉNT FELTŰNŐ 30 PERCES MŰSORELŐZETES MOTOR (20 MP-IG KÉPERNYŐN)
    function evaluateUpcomingDrawerSchedule(hour, minute, second) {
        if (!isViewerPlaying || isVideoTransitioning || isIntroFlipRunning || isEndSequenceRunning) return;

        if ([0, 15, 30, 45].includes(minute) && second === 12 && lastDrawerTriggerMinute !== minute) {
            lastDrawerTriggerMinute = minute;
            triggerUpcomingDrawer(hour);
        }
    }

    function triggerUpcomingDrawer(hour) {
        const todayKey = getSelectedDateKey(0);
        const schedule = weekSchedules[todayKey] || [];
        if (schedule.length === 0) return;

        const now = new Date();
        const curSecToday = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
        const windowEndSec = curSecToday + (30 * 60);

        const upcomingClips = schedule.filter(item => item.startSec > curSecToday && item.startSec <= windowEndSec);
        if (upcomingClips.length === 0) return;

        const curCat = getDaypartKeyForHour(hour !== undefined ? hour : now.getHours());
        const showConfig = tvDaypartConfig[curCat] || tvDaypartConfig.delelott;
        drawerShowBlockTitle.textContent = `${showConfig.title} · MŰSORAJÁNLÓ`;

        drawerUpcomingList.innerHTML = upcomingClips.slice(0, 4).map(clip => {
            const parsed = parseArtistAndTitle(clip.title);
            const timeFormatted = clip.startTimeStr.slice(0, 5);
            return `
                <div class="drawer-item">
                    <span class="drawer-time">${timeFormatted}</span>
                    <div class="drawer-track-meta">
                        <span class="drawer-track-artist">${parsed.artist}</span>
                        <span class="drawer-track-title">${parsed.title}</span>
                    </div>
                </div>
            `;
        }).join('');

        upcomingDrawer.classList.add('drawer-show');
        isUpcomingDrawerVisible = true;
        applyCloudPositions();

        clearTimeout(upcomingDrawerHideTimer);
        upcomingDrawerHideTimer = setTimeout(() => {
            upcomingDrawer.classList.remove('drawer-show');
            isUpcomingDrawerVisible = false;
        }, 20000);
    }

    // ⚡ VALÓS IDEJŰ STÚDIÓJEL-VEZÉRLŐ ÉS PUSH SZINKRONIZÁCIÓ (FIREBASE REALTIME)
    function applyBroadcastSettingsState(s) {
        if (!s || typeof s !== 'object') return;
        if (s.isBroadcasting !== undefined) isTvBroadcasting = s.isBroadcasting;
        if (s.logo_visible !== undefined) isLogoVisible = s.logo_visible;
        if (s.rating !== undefined) currentAgeRating = s.rating;
        if (s.rating_auto_timer !== undefined) isRatingAutoTimerEnabled = s.rating_auto_timer;
        if (s.rating_on_hour !== undefined) ratingTimerOnHour = parseInt(s.rating_on_hour, 10);
        if (s.rating_off_hour !== undefined) ratingTimerOffHour = parseInt(s.rating_off_hour, 10);
        if (s.news_ticker_enabled !== undefined) isNewsTickerManualEnabled = s.news_ticker_enabled;
        cloudPositions = s;

        const badge = document.getElementById('live-status-badge');
        const text = document.getElementById('live-status-text');
        if (isTvBroadcasting) {
            badge.classList.add('online');
            text.textContent = 'ÉLŐ ADÁS';
        } else {
            badge.classList.remove('online');
            text.textContent = 'OFFLINE';
        }

        if (isViewerPlaying) {
            applyVisuals();
            if (!isTvBroadcasting) {
                showMonoscope();
            } else if (isMonoscopeActive) {
                const now = new Date();
                const currentSecToday = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
                checkScheduleAndPlayback(currentSecToday, weekSchedules[getSelectedDateKey(0)] || []);
            }
        }
    }

    function applyScheduleState(data) {
        if (!data || typeof data !== 'object') return;
        weekSchedules = data;
        if (isViewerPlaying && isTvBroadcasting) {
            const now = new Date();
            const currentSecToday = now.getHours() * 3600 + now.getMinutes() * 60 + now.getSeconds();
            const todaySched = weekSchedules[getSelectedDateKey(0)] || [];
            const currentScheduledItem = todaySched.find(item => currentSecToday >= item.startSec && currentSecToday < item.endSec);

            if (!currentScheduledItem || currentScheduledItem.id !== currentlyPlayingId) {
                checkScheduleAndPlayback(currentSecToday, todaySched);
            }
        }
    }

    // 📡 AZONNALI CSATLAKOZÁS ÉS REALTIME SSE STREAM
    async function initRealtimeBroadcastSync() {
        try {
            const [setRes, schRes] = await Promise.all([
                fetch(`${FIREBASE_URL}/tv_broadcast_settings.json?_t=${Date.now()}`),
                fetch(`${FIREBASE_URL}/tv_week_schedules.json?_t=${Date.now()}`)
            ]);
            if (setRes.ok) applyBroadcastSettingsState(await setRes.json());
            if (schRes.ok) applyScheduleState(await schRes.json());
        } catch(e) {}

        try {
            const settingsSource = new EventSource(`${FIREBASE_URL}/tv_broadcast_settings.json`);
            settingsSource.addEventListener('put', e => {
                try {
                    const payload = JSON.parse(e.data);
                    const s = (payload.path === "/") ? payload.data : payload;
                    applyBroadcastSettingsState(s);
                } catch(err) {}
            });

            const schedulesSource = new EventSource(`${FIREBASE_URL}/tv_week_schedules.json`);
            schedulesSource.addEventListener('put', e => {
                try {
                    const payload = JSON.parse(e.data);
                    const data = (payload.path === "/") ? payload.data : payload;
                    applyScheduleState(data);
                } catch(err) {}
            });
        } catch(err) {}

        setInterval(async () => {
            try {
                const res = await fetch(`${FIREBASE_URL}/tv_broadcast_settings.json?_t=${Date.now()}`);
                if (res.ok) applyBroadcastSettingsState(await res.json());
            } catch(e) {}
        }, 2000);
    }

    function toggleFullscreen() {
        if (!document.fullscreenElement && !document.webkitFullscreenElement) {
            if (tvScreenContainer.requestFullscreen) tvScreenContainer.requestFullscreen();
            else if (tvScreenContainer.webkitRequestFullscreen) tvScreenContainer.webkitRequestFullscreen();
        } else {
            if (document.exitFullscreen) document.exitFullscreen();
            else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
        }
    }

    function togglePiP() {
        const activeDeck = activeDeckName === 'A' ? deckA : deckB;
        if (document.pictureInPictureElement) document.exitPictureInPicture();
        else if (activeDeck.requestPictureInPicture) activeDeck.requestPictureInPicture();
    }

    window.addEventListener('DOMContentLoaded', async () => {
        updateResponsiveScaling();
        initRealtimeBroadcastSync();
        fetchLiveNews();
        fetchLiveWeather();
        startWeatherCityRotator();
        setInterval(fetchLiveNews, 10 * 60 * 1000);
        setInterval(fetchLiveWeather, 10 * 60 * 1000);
    });
</script>
</body>
</html>
